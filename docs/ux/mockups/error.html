<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>안내 · DBModeler 목업</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="assets/app.css">
<script src="assets/app.js"></script>
<style>
  .err { max-width:560px; margin:80px auto; text-align:center; }
  .err .code { font:500 13px var(--font-mono); color:var(--fg-2); }
  .err h1 { font-size:24px; margin:8px 0 12px; }
  .err p { color:var(--fg-2); line-height:24px; }
  .err .acts { display:flex; gap:8px; justify-content:center; margin-top:20px; }
  .err .foot { margin-top:40px; font:400 11px var(--font-mono); color:var(--fg-2); }
</style>
</head>
<body data-page="error">
<div id="app">
<div id="content" class="page"><div class="scroll"><div class="err" id="err"></div></div></div>
</div>
<script>
window.pageInit = function () {
  const q = new URLSearchParams(location.search), code = q.get('code') || '404';
  const need = q.get('need'), what = q.get('what'), from = q.get('from');
  const P = {
    // 403: asking for the role is the way forward, so it comes first (#15)
    '403': ['403 · 권한 없음', '이 화면을 볼 권한이 없습니다', `${what || '이 화면'}은(는) <b>${need || 'Admin'}</b> 역할이 필요합니다. 지금 역할: ${ME.roles.map(r => ROLE_NAME[r]).join(', ')}.`, `<a class="btn primary" href="mypage.html?req=${encodeURIComponent(need || 'Admin')}&what=${encodeURIComponent(what || '')}#profile" title="Admin에게 ${need || 'Admin'} 역할을 요청합니다">역할 변경 요청</a><a class="btn" href="home.html">홈으로</a>`],
    // 404: a way back (home · search · previous screen) instead of a dead end (#15)
    '404': ['404 · 찾을 수 없음', '찾는 화면이나 문서가 없습니다', `${what ? `<b>${what}</b>은(는) ` : ''}삭제됐거나 다른 곳으로 옮겨졌을 수 있습니다. 검색으로 찾거나 홈에서 다시 시작하세요.`, `<a class="btn primary" href="home.html">홈으로</a><button class="btn" id="go-search">${icon('search', 14)} 검색으로 찾기</button><button class="btn ghost" onclick="history.back()">이전 화면</button>`],
    '500': ['500 · 일시적인 오류', '요청을 처리하지 못했습니다', '잠시 후 다시 시도하세요. 편집 중이던 내용은 이 브라우저에 보관돼 있어 다시 연결되면 병합합니다.<br><span class="mono caption">오류 ID: E-20261118-7F3A</span>', `<button class="btn primary" onclick="location.reload()">다시 시도</button><a class="btn" href="home.html">홈으로</a><button class="btn" id="cp-id">오류 ID 복사</button>`],
    'maint': ['점검 중', '정기 점검 중입니다', '11/20(목) 18:00 ~ 19:00. 점검이 끝나면 자동으로 다시 연결합니다. 편집 내용은 자동 보관됐습니다.', `<button class="btn" onclick="location.reload()">상태 확인</button>`],
    'logout': ['로그아웃', '로그아웃되었습니다', '공동 편집 중이던 업무 영역의 접속자 목록에서도 빠졌습니다.', `<a class="btn primary" href="login.html">다시 로그인 (사내 SSO)</a>`],
    'expired': ['세션 만료', '30분 동안 입력이 없어 세션이 만료됐습니다', '편집 중이던 내용은 이 브라우저에 보관했습니다. 다시 로그인하면 원래 화면으로 돌아가 이어서 작업합니다.', `<a class="btn primary" href="login.html?expired=1&from=${encodeURIComponent(from || 'home.html')}">다시 로그인하고 이어서 작업</a>`]
  };
  const p = P[code] || P['404'];
  document.title = p[0] + ' · DBModeler 목업';
  document.getElementById('err').innerHTML = `<div class="code">${p[0]}</div><h1>${p[1]}</h1><p>${p[2]}</p><div class="acts">${p[3]}</div><div class="foot">${PRODUCT.name} ${PRODUCT.version} · build ${PRODUCT.build} · ${PRODUCT.env}</div>`;
  // 404 → the shell's global search, prefilled with what was missing
  const gs = document.getElementById('go-search'); if (gs) gs.onclick = () => { if (!window.gsearchOpen) { location.href = 'home.html'; return; } window.gsearchOpen(); const i = document.getElementById('gs-q'); if (i && what) { i.value = what; i.dispatchEvent(new Event('input')); } };
  // real clipboard copy with a fallback (CX13-16)
  const cp = document.getElementById('cp-id'); if (cp) cp.onclick = () => { const id = 'E-20261118-7F3A'; const ok = () => toast(`오류 ID ${id}를 복사했습니다 — 문의할 때 붙여 넣으세요`, 'success'); (navigator.clipboard ? navigator.clipboard.writeText(id) : Promise.reject()).then(ok, () => { window.prompt('오류 ID를 복사하세요', id); }); };
};
</script>
</body>
</html>
