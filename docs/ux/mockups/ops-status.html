<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>시스템 상태 · NeoDB 목업</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="assets/app.css">
<script src="assets/app.js"></script>
<style>
  /* 시스템 상태 — 04 운영 확인 최소 기능 §3.7 (관제 시스템 아님: 서비스가 스스로 확인한 결과를 보여 줄 뿐) */
  .os-sum { display:grid; grid-template-columns:repeat(5,1fr); gap:16px; margin-bottom:16px; }
  .os-sum .card { padding:16px; display:flex; flex-direction:column; gap:4px; min-width:0; }
  .os-sum .lbl { font-size:12px; color:var(--fg-2); display:flex; align-items:center; gap:6px; }
  .os-sum .val { font-size:20px; line-height:28px; font-weight:600; letter-spacing:-.2px; font-variant-numeric:tabular-nums; }
  .os-sum .sub { font-size:12px; color:var(--fg-2); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .os-grid { display:grid; grid-template-columns:1fr 1fr; gap:16px; align-items:start; }
  .os-grid > .full { grid-column:1 / -1; }
  .os-card { padding:0; overflow:hidden; }
  .os-card > header { display:flex; align-items:center; gap:8px; padding:0 16px; min-height:44px; border-bottom:1px solid var(--border); }
  .os-card > header h2 { font-size:14px; font-weight:600; margin:0; }
  .os-card > header .meta { margin-left:auto; font-size:12px; color:var(--fg-2); display:flex; align-items:center; gap:6px; }
  .os-card > header .meta > span + span::before { content:"·"; margin-right:6px; }
  .os-card > .body { padding:16px; }
  .os-card .tbl { border:0; }
  /* 카드 머리 바로 밑 표: 머리 선과 겹치지 않게 위 선 없음 */
  #os-alerts .tbl > thead > tr > th, #os-svc .tbl > thead > tr > th { box-shadow:inset 0 -1px 0 var(--border); }
  /* 라벨 폭 L ↔ 표 첫 열 L+16: kv 값과 표 2열 글자가 같은 선에서 시작 */
  .os-card .kv { margin-bottom:0; grid-template-columns:var(--os-lbl,128px) 1fr; gap:8px 16px; }
  .os-card .kv dd { font-weight:400; }
  #os-jobcard { --os-lbl:176px; }
  .os-meter { display:grid; grid-template-columns:128px 1fr 160px; gap:8px 16px; align-items:center; font-size:14px; }
  .os-meter + .os-meter { margin-top:8px; }
  .os-meter .progress { height:8px; }
  .os-meter .progress > i.w { background:var(--ds-amber-700); } .os-meter .progress > i.f { background:var(--ds-red-700); }
  .os-meter .n { text-align:right; font-variant-numeric:tabular-nums; color:var(--fg-2); font-size:13px; }
  .st { display:inline-flex; align-items:center; gap:6px; white-space:nowrap; }
  .st .dot-i.ok { background:var(--ds-green-700); } .st .dot-i.warn { background:var(--ds-amber-700); } .st .dot-i.fail { background:var(--ds-red-700); } .st .dot-i.unk { background:var(--ds-gray-600); }
  .tnum { font-variant-numeric:tabular-nums; }
  .os-n.f { color:var(--ds-red-900); font-weight:600; } .os-n.w { color:var(--ds-amber-900); font-weight:600; }
  .os-demo { display:flex; align-items:center; gap:6px; }
  .os-demo .caption { margin-right:2px; }
  .os-card .empty { border:0; border-radius:0; box-shadow:none; padding:24px 16px; }
  .os-card .empty b { font-size:14px; font-weight:600; }
  /* 열 폭: 짧은 열은 고정, 한 열만 늘어남 */
  #os-alerts th:nth-child(1) { width:80px; } #os-alerts th:nth-child(2) { width:160px; } #os-alerts th:nth-child(4), #os-alerts th:nth-child(5) { width:120px; } #os-alerts th:nth-child(6) { width:160px; } #os-alerts th:nth-child(7) { width:136px; }
  #os-svc th:nth-child(1) { width:200px; } #os-svc th:nth-child(2) { width:240px; } #os-svc th:nth-child(3), #os-svc th:nth-child(4) { width:128px; } #os-svc th:nth-child(5) { width:136px; }
  #os-bk-runs th:nth-child(1) { width:144px; } #os-bk-runs th:nth-child(2) { width:72px; } #os-bk-runs th:nth-child(4) { width:112px; } #os-bk-runs th:nth-child(5) { width:96px; }
  #os-jobs th:nth-child(1) { width:192px; } #os-jobs th:nth-child(2) { width:128px; }
</style>
</head>
<body data-page="ops-status">
<div id="app">
<div id="content" class="page">
  <div class="page-header">
    <h1>시스템 상태</h1><span class="badge" title="관리 › 시스템 상태 · 설정 권한(Admin)만">Admin</span>
    <div class="actions">
      <span class="os-demo" role="group" aria-label="목업 상태 보기"><span class="caption muted">목업 상태</span>
        <button class="chip" data-st="ok">정상</button><button class="chip" data-st="warn">주의</button><button class="chip" data-st="fail">장애</button><button class="chip" data-st="stale">확인 안 됨</button></span>
      <button class="btn" id="os-refresh" title="서버가 마지막으로 확인한 결과를 다시 불러옵니다(확인 작업을 새로 돌리지는 않음)"><i data-ic=refresh></i>새로 고침</button>
    </div>
  </div>
  <div class="scroll"><div class="pad">
    <div id="os-banner"></div>
    <div class="os-sum" id="os-sum"></div>
    <div class="os-grid">
      <section class="card os-card full"><header><h2>열린 알림</h2><span class="badge" id="os-al-n"></span><span class="meta">해결되면 자동으로 닫힘 · 열려 있으면 24시간마다 다시 알림</span></header><div id="os-alerts"></div></section>
      <section class="card os-card full"><header><h2>서비스</h2><span class="meta" id="os-svc-m"></span></header><div id="os-svc"></div></section>
      <section class="card os-card"><header><h2>저장 공간</h2><span class="meta" id="os-disk-m"></span></header><div class="body" id="os-disk"></div></section>
      <section class="card os-card"><header><h2>인증서 · 시각 · 버전</h2><span class="meta" id="os-etc-m"></span></header><div class="body" id="os-etc"></div></section>
      <section class="card os-card"><header><h2>백업</h2><span class="meta" id="os-bk-m"></span></header><div class="body" id="os-bk"></div><div id="os-bk-runs"></div></section>
      <section class="card os-card" id="os-jobcard"><header><h2>작업 대기열 · 정기 작업</h2><span class="meta" id="os-job-m"></span></header><div class="body" id="os-q"></div><div id="os-jobs"></div></section>
    </div>
    <p class="caption muted u-mt-16">이 화면은 관제 시스템이 아닙니다. 서비스가 5분마다 스스로 확인한 결과를 보여 줍니다. 서버 전체가 멈추면 이 화면도 열리지 않으니, 운영자는 서버에서 <span class="mono">neodb.sh status</span>로 확인합니다.</p>
  </div></div>
</div>
</div>
<script>
window.pageInit = function () {
  const auQ = (() => { const s = new URLSearchParams(location.search); return s.has('audit') && s.get('as') ? '&audit=1&as=' + s.get('as') : ''; })();
  if (!can('settings')) { location.replace('error.html?code=403&need=Admin&what=시스템 상태' + auQ); return; }
  const $ = id => document.getElementById(id);
  const E = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const ST = { ok: ['ok', '정상'], warn: ['warn', '주의'], fail: ['fail', '장애'], unk: ['unk', '확인 안 됨'] };
  const st = (k, label) => `<span class="st"><i class="dot-i ${ST[k][0]}" aria-hidden="true"></i>${E(label || ST[k][1])}</span>`;
  const BADGE = { ok: 'b-success', warn: 'b-warning', fail: 'b-danger', unk: '' };
  const fresh = f => f === 'fresh' ? '' : f === 'stale' ? '<span class="badge b-warning" title="마지막 확인이 15분보다 오래됨 — 확인 작업이 멈췄을 수 있음">오래됨</span>' : f === 'none' ? '<span class="badge" title="아직 한 번도 확인하지 못함">측정 안 됨</span>' : '<span class="badge b-danger" title="확인 결과를 읽지 못함">읽기 실패</span>';
  const meta = (at, f) => `${fresh(f)}<span>마지막 확인 ${E(at)}</span>`;
  const ACK = 'dbm-ops-ack';
  const LJ = (k, d) => { try { return JSON.parse(localStorage.getItem(k)) || d; } catch (e) { return d; } };
  const LS = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} };
  const hhmm = () => new Date().toTimeString().slice(0, 5);

  // 데모 데이터 — 목업 상태(정상 · 주의 · 장애 · 확인 안 됨)별
  function demo(s) {
    const T = '11-25 14:35';
    const d = {
      at: T, fresh: 'fresh',
      svc: [
        ['neodb-web', '사용자 입구 (HTTPS)', 'ok', '9일 4시간', 0, '1.0.0-b20261125'],
        ['neodb-api-1', '업무 API', 'ok', '9일 4시간', 0, '1.0.0-b20261125'],
        ['neodb-api-2', '업무 API (두 번째)', 'ok', '9일 4시간', 0, '1.0.0-b20261125'],
        ['neodb-erd-collab', 'ERD 공동 편집', 'ok', '9일 4시간', 0, '1.0.0-b20261125'],
        ['neodb-job-worker', '뒤에서 도는 작업', 'ok', '9일 4시간', 0, '1.0.0-b20261125'],
        ['neodb-postgres', '데이터베이스', 'ok', '23일 2시간', 0, '16.4']
      ],
      db: { conn: '18 / 200', size: '42.6 GB' },
      bk: { last: '11-25 02:10 (전체)', ok: 'ok', archive: '1분 전', archOk: 'ok', verified: '11-24 03:00 복구 시험 통과', point: '11-25 14:33', space: '1.2 TB 남음 (61%)' },
      runs: [['11-25 02:10', '차등', 'ok', '14분', '3.1 GB'], ['11-24 02:10', '차등', 'ok', '13분', '2.9 GB'], ['11-23 02:10', '전체', 'ok', '1시간 52분', '41.8 GB'], ['11-22 02:10', '차등', 'ok', '12분', '2.4 GB'], ['11-21 02:10', '차등', 'ok', '15분', '3.3 GB']],
      disk: [['데이터 (DB · 파일)', 46, '1.84 / 4.0 TB'], ['WAL 보관 대기', 3, '12 / 400 GB'], ['로그', 21, '42 / 200 GB']],
      q: { wait: 2, run: 1, fail24: 0 },
      jobs: [['백업 (전체 · 차등)', '매일 02:10', 'ok', '11-25 02:10'], ['사용 기한 만료 처리', '매일 00:05', 'ok', '11-25 00:05'], ['관리 변경 확인 7일 만료', '매시 정각', 'ok', '11-25 14:00'], ['오래된 세션 정리', '매시 30분', 'ok', '11-25 14:30'], ['업로드 보존 기한 정리', '매일 03:30', 'ok', '11-25 03:30'], ['투영 재검증', '매일 04:00', 'ok', '11-25 04:00'], ['복구 시험 (분기)', '분기 첫 일요일', 'ok', '11-24 03:00']],
      cert: { k: 'ok', until: '2027-08-31 (279일 남음)' }, clock: { k: 'ok', v: '차이 0.2초 (호스트 NTP 동기화됨)' }, ver: { k: 'ok', v: '1.0.0-b20261125 · 모든 서비스 같음' },
      alerts: []
    };
    if (s === 'warn') {
      d.disk[0] = ['데이터 (DB · 파일)', 74, '2.96 / 4.0 TB'];
      d.cert = { k: 'warn', until: '2026-12-31 (36일 남음)' };
      d.svc[3] = ['neodb-erd-collab', 'ERD 공동 편집', 'ok', '2시간 11분', 2, '1.0.0-b20261125'];
      d.q = { wait: 38, run: 2, fail24: 1 };
      d.jobs[4] = ['업로드 보존 기한 정리', '매일 03:30', 'warn', '11-25 03:30 · 1건 다시 시도'];
      d.alerts = [
        { id: 'al-disk', key: 'disk.data', lv: 'warn', what: '데이터 저장 공간 74% — 80%를 넘으면 장애로 바뀝니다. 오래된 업로드 정리 또는 저장 공간 증설이 필요합니다.', since: '11-25 09:05', last: '11-25 14:35', to: 'Admin' },
        { id: 'al-cert', key: 'cert.tls', lv: 'warn', what: 'HTTPS 인증서가 36일 뒤(2026-12-31) 만료됩니다. 기관 인증서 교체를 요청해 주세요.', since: '11-24 06:00', last: '11-25 06:00', to: 'Admin · 기관 담당자' }
      ];
    }
    if (s === 'fail') {
      d.svc[4] = ['neodb-job-worker', '뒤에서 도는 작업', 'fail', '3분', 4, '1.0.0-b20261125'];
      d.bk = { last: '11-24 02:10 (차등)', ok: 'fail', archive: '47분 전', archOk: 'fail', verified: '11-24 03:00 복구 시험 통과', point: '11-25 13:48', space: '1.2 TB 남음 (61%)' };
      d.runs.unshift(['11-25 02:10', '차등', 'fail', '2분', '—']);
      d.runs.pop();
      d.disk[0] = ['데이터 (DB · 파일)', 83, '3.32 / 4.0 TB'];
      d.q = { wait: 412, run: 0, fail24: 9 };
      d.jobs[0] = ['백업 (전체 · 차등)', '매일 02:10', 'fail', '11-25 02:10 · 백업 저장소 연결 실패'];
      d.alerts = [
        { id: 'al-bk', key: 'backup.run', lv: 'fail', what: '오늘 02:10 백업이 실패했습니다(백업 저장소 연결 실패). 마지막 성공은 어제 02:10입니다.', since: '11-25 02:12', last: '11-25 14:35', to: 'Admin · 기관 담당자' },
        { id: 'al-wal', key: 'backup.wal', lv: 'fail', what: 'WAL 보관이 47분째 밀려 있습니다. 지금 서버가 멈추면 최대 47분의 변경을 잃을 수 있습니다.', since: '11-25 13:50', last: '11-25 14:35', to: 'Admin · 기관 담당자' },
        { id: 'al-restart', key: 'restart', lv: 'fail', what: 'neodb-job-worker가 1시간에 4번 다시 시작했습니다. 엑셀 검사 · 산출물 · 메일이 늦어집니다.', since: '11-25 14:20', last: '11-25 14:35', to: 'Admin' },
        { id: 'al-disk', key: 'disk.data', lv: 'fail', what: '데이터 저장 공간 83% — 저장 공간을 늘리거나 오래된 파일을 정리해야 합니다.', since: '11-25 11:40', last: '11-25 14:35', to: 'Admin · 기관 담당자' }
      ];
    }
    if (s === 'stale') {
      d.fresh = 'stale'; d.at = '11-25 13:02';
      d.svc = d.svc.map((r, i) => i === 4 ? ['neodb-job-worker', '뒤에서 도는 작업', 'unk', '—', 0, '1.0.0-b20261125'] : r);
      d.bk = { last: '11-25 02:10 (차등)', ok: 'ok', archive: '확인 안 됨', archOk: 'unk', verified: null, point: null, space: '확인 안 됨' };
      d.disk = null; d.q = null;
      d.jobs = d.jobs.map(j => [j[0], j[1], 'unk', '—']);
      d.alerts = [{ id: 'al-stale', key: 'checks.stale', lv: 'warn', what: '1시간 33분 동안 상태 확인이 돌지 않았습니다. neodb-job-worker가 멈췄을 수 있어요. 서버에서 neodb.sh status로 확인해 주세요.', since: '11-25 13:20', last: '11-25 14:35', to: 'Admin' }];
    }
    return d;
  }

  let MODE = new URLSearchParams(location.search).get('state') || 'ok';
  if (!ST[MODE] && MODE !== "stale") MODE = "ok";

  function render() {
    const d = demo(MODE); const acked = LJ(ACK, {});
    document.querySelectorAll('[data-st]').forEach(b => { b.classList.toggle('on', b.dataset.st === MODE); b.setAttribute('aria-pressed', b.dataset.st === MODE); });
    const worst = MODE === 'stale' ? 'unk' : MODE;
    const open = d.alerts.length, nFail = d.alerts.filter(a => a.lv === 'fail').length;
    // 맨 위 한 줄 — 지금 할 일이 있는지
    const bn = { ok: ['success', 'check', '모든 확인 항목이 정상입니다.', '마지막 확인 ' + d.at + ' · 다음 확인 5분 뒤'],
      warn: ['warning', 'warn', `주의 ${open}건 — 지금 장애는 아니지만 미리 손봐야 합니다.`, '아래 열린 알림에서 무엇을 해야 하는지 확인하세요.'],
      fail: ['danger', 'err', `장애 ${nFail}건 — 바로 조치가 필요합니다.`, 'Admin과 기관 담당자에게 앱 알림을 보냈습니다(메일 설정 시 메일도).'],
      unk: ['warning', 'warn', '상태 확인이 오래되었습니다 — 아래 값은 13:02 기준입니다.', '확인 작업(neodb-job-worker)이 멈춘 것 같아요. 서버에서 neodb.sh status로 확인하세요.'] }[worst];
    $('os-banner').innerHTML = `<div class="banner ${bn[0]} u-mb-16"><i data-ic=${bn[1]} class="ic"></i><div class="grow"><b>${E(bn[2])}</b> <span class="caption">${E(bn[3])}</span></div></div>`;
    // 요약 5칸
    const svcBad = d.svc.filter(r => r[2] !== 'ok');
    const diskTop = d.disk ? d.disk[0][1] : null;
    const tile = (lbl, k, val, sub) => `<div class="card"><span class="lbl">${st(k, lbl)}</span><span class="val num">${val}</span><span class="sub" title="${E(sub)}">${E(sub)}</span></div>`;
    $('os-sum').innerHTML = [
      tile('서비스', svcBad.some(r => r[2] === 'fail') ? 'fail' : svcBad.length ? 'unk' : 'ok', `${d.svc.length - svcBad.length} / ${d.svc.length}`, svcBad.length ? svcBad.map(r => r[0]).join(', ') + ' 확인 필요' : '모두 응답함'),
      tile('백업', d.bk.ok === 'fail' || d.bk.archOk === 'fail' ? 'fail' : d.bk.archOk === 'unk' ? 'unk' : 'ok', E(d.bk.last.split(' (')[0]), '마지막 성공 · WAL 보관 ' + d.bk.archive),
      tile('저장 공간', diskTop == null ? 'unk' : diskTop >= 80 ? 'fail' : diskTop >= 70 ? 'warn' : 'ok', diskTop == null ? '—' : diskTop + '%', diskTop == null ? '확인 안 됨' : '데이터 · ' + d.disk[0][2]),
      tile('작업 대기열', !d.q ? 'unk' : d.q.fail24 >= 5 ? 'fail' : d.q.fail24 || d.q.wait > 30 ? 'warn' : 'ok', d.q ? d.q.wait + '건' : '—', d.q ? `대기 · 실행 ${d.q.run} · 24시간 실패 ${d.q.fail24}` : '확인 안 됨'),
      tile('인증서', d.cert.k, E(d.cert.until.split(' (')[1].replace(')', '')), '만료 ' + d.cert.until.split(' ')[0])
    ].join('');
    // 열린 알림
    $('os-al-n').textContent = open ? open + '건' : '없음'; $('os-al-n').className = 'badge ' + (nFail ? 'b-danger' : open ? 'b-warning' : '');
