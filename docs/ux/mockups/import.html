<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>가져오기 · NeoDB 목업</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="assets/app.css">
<script src="assets/app.js"></script>
<style>
  /* fixed widths live in the page style, not inline (17 §6.2) */
  #dst-area { width:220px; } #newname-f { max-width:360px; }
</style>
</head>
<body data-page="model">
<div id="app">
<div id="content" class="page">
  <div class="page-header">
    <nav class="crumbs" aria-label="경로"><a href="system.html">요구사항관리</a><span class="sl" aria-hidden="true">/</span></nav>
    <h1>가져오기</h1>
    
    <div class="actions">
      <span class="seg"><button id="src-xls" aria-pressed="false">엑셀 정의서</button><button class="on" aria-pressed="true">DDL</button></span>
    </div>
  </div>
  <div class="page-body">
    <div class="main" style="flex:0 0 46%;border-right:1px solid var(--border)">
      <div class="toolbar"><b class="u-fs-14">DDL 붙여넣기 또는 파일</b><span class="grow"></span><button class="btn sm" id="pick-file">.sql 파일 선택</button><input type="file" id="sql-file" accept=".sql,.ddl,.txt,text/plain" hidden aria-label="DDL 파일 선택"><button class="btn sm ghost" id="ex-file">예시 불러오기</button><button class="btn sm" id="ex-bad">잘못된 예시</button><button class="btn sm primary" id="parse" data-busy>읽기</button></div>
      <div class="pad u-flex-1 u-flex u-col"><textarea class="input mono" id="ddl" style="flex:1;min-height:420px;font-size:12px;line-height:18px" placeholder="CREATE TABLE … 를 붙여넣으세요. 컬럼 뒤 주석(-- 한글명)을 논리명으로 씁니다." aria-label="DDL"></textarea>
        <div class="caption muted u-mt-8">컬럼 뒤 <span class="mono">-- 한글명</span> 주석을 논리명으로 읽습니다(없으면 물리명 그대로). PK·FK 제약을 함께 읽습니다.</div></div>
    </div>
    <div class="main">
      <div class="toolbar"><b class="u-fs-14">읽기 미리보기</b><span id="pstate"></span><span class="grow"></span><span class="caption muted" id="psum"></span></div>
      <div class="scroll">
        <table class="tbl"><thead><tr><th>테이블</th><th>논리명</th><th class="num">컬럼</th><th>PK</th><th class="num">FK</th><th>점검</th></tr></thead><tbody id="prev"><tr class="er first"><td colspan="6" class="caption muted u-tc u-p-32">왼쪽에 DDL을 넣고 [파싱]을 누르세요</td></tr></tbody></table>
        <div class="pad">
          <div class="field"><label>가져올 위치</label>
            <div class="flex"><label class="flex caption"><input type="radio" name="dst" value="new" checked> 새 업무 영역</label><label class="flex caption"><input type="radio" name="dst" value="cur"> 기존 업무 영역에 추가</label><select class="input" id="dst-area" aria-label="기존 업무 영역"></select></div></div>
          <div class="field" id="newname-f"><label for="newname">새 업무 영역 이름 *</label><input class="input" id="newname" value="현행 요구사항 DB"></div>
          <div class="banner"><i data-ic=info></i><div>가져온 구조로 업무 영역(v1 작업 버전)을 만들고 <b>표준 맞추기</b>를 그 영역으로 엽니다. 이름·타입은 표준 맞추기에서 확인한 뒤에만 바뀝니다.</div></div>
        </div>
      </div>
      <div class="rp-foot u-bg"><span class="caption muted" id="foot-note"></span><span class="grow"></span><a class="btn" id="cancel" href="model.html">취소</a><button class="btn" id="go" data-busy disabled>가져오기</button></div>
    </div>
  </div>
</div>
</div>
<script>
window.pageInit = function () {
  const $ = id => document.getElementById(id);
  const q = new URLSearchParams(location.search);
  const esc = v => String(v == null ? '' : v).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);   // FC-02: what the DDL text says is text, never markup
  // script-driven moves keep the review role (&audit=1&as=) like the shell does for plain links
  const go = u => { const as = q.has('audit') && q.get('as'); if (as && !/[?&]as=/.test(u)) u += (u.includes('?') ? '&' : '?') + 'audit=1&as=' + as; location.href = u; };
  // the area we came from (model ⋯ › 가져오기): the way back and the "add to existing" choice follow it
  const FROM = getModels()[q.get('area')] ? q.get('area') : null;
  { const c = document.querySelector('.crumbs a'); if (c) c.textContent = curSys().name; }   // was a fixed ‘요구사항관리’
  if (FROM) $('cancel').setAttribute('href', `model.html?area=${FROM}`);
  // the seg used to have a dead ‘엑셀 정의서’ button: say plainly it is not here yet and keep DDL selected
  $('src-xls').onclick = () => { location.href = 'import-excel.html' + (FROM ? `?area=${FROM}` : ''); };   /* 26: the Excel (table design) import lives on its own page */
  const SAMPLE = `CREATE TABLE RQMS.RQRM_D ( -- 요구사항내역
  DEMND_MATER_ID   VARCHAR2(10) NOT NULL, -- 요구사항ID
  RQRM_NM          VARCHAR2(100), -- 요구사항명
  REQ_CUST_NM      VARCHAR2(100), -- 요청고객명
  PRJ_ID           VARCHAR2(10), -- 프로젝트ID
  CONSTRAINT RQRM_D_PK PRIMARY KEY (DEMND_MATER_ID)
);
CREATE TABLE RQMS.PRJ_M ( -- 프로젝트기본
  PRJ_ID           VARCHAR2(10) NOT NULL, -- 프로젝트ID
  PRJ_NM           VARCHAR2(100), -- 프로젝트명
  WINCON_AMOUNT    NUMBER(18), -- 수주금액
  PRJ_ENDDD        CHAR(8), -- 프로젝트종료일
  CONSTRAINT PRJ_M_PK PRIMARY KEY (PRJ_ID)
);
CREATE TABLE RQMS.TMP_LOG ( -- 임시로그
  LOG_TEXT         CLOB -- 로그내용
);
ALTER TABLE RQMS.RQRM_D ADD CONSTRAINT RQRM_D_FK1 FOREIGN KEY (PRJ_ID) REFERENCES RQMS.PRJ_M (PRJ_ID);`;
  // permission: only modelers import (CX12-28)
  const canImport = can('model.edit', { system: curSys().code });
  if (!canImport) document.querySelector('.page-header').insertAdjacentHTML('afterend', `<div class="pad u-pb-0"><div class="banner info"><i data-ic=info></i><div class="grow"><b>조회 전용</b> — ${ME.has('modeler') ? `내 담당 시스템에 ${esc(josa(curSys().name, '이/가'))} 없어 가져오기를 할 수 없습니다. <a href="mypage.html?req=sys&sys=${encodeURIComponent(curSys().name)}">담당 시스템 추가 요청</a>` : 'DDL 가져오기는 모델러 역할만 할 수 있습니다.'}</div></div></div>`);
  const models = getModels();
  $('dst-area').innerHTML = Object.entries(models).map(([id, m]) => { const L = modelLock(id); return `<option value="${id}" ${L.state !== 'edit' ? 'disabled' : ''}>${esc(m.name)} · v${m.ver}${L.state !== 'edit' ? ' (편집 불가)' : ''}</option>`; }).join('');
  let parsed = null;
  // a deliberately small parser: CREATE TABLE blocks, column lines with "-- 논리명", PRIMARY KEY, ALTER … FOREIGN KEY
  function parse(src) {
    const tables = [], errs = [];
    const re = /CREATE\s+TABLE\s+(?:\w+\.)?(\w+)\s*\((?:\s*--\s*([^\n]*))?([\s\S]*?)\n\s*\);/gi; let m;
    while ((m = re.exec(src))) {
      const tb = { phys: m[1], name: (m[2] || '').trim() || m[1], cols: [], pk: [] };
      m[3].split('\n').forEach(line => { const l = line.trim(); if (!l) return;
        const pk = l.match(/PRIMARY\s+KEY\s*\(([^)]*)\)/i); if (pk) { tb.pk = pk[1].split(',').map(x => x.trim()); return; }
        if (/^CONSTRAINT/i.test(l)) return;
        const c = l.match(/^(\w+)\s+([A-Z0-9_]+(?:\([^)]*\))?)(.*?)(?:--\s*(.*))?$/i); if (!c) { errs.push(`${tb.phys}: 읽을 수 없는 줄 — ${l.slice(0, 40)}`); return; }
        tb.cols.push({ p: c[1], t: c[2].toUpperCase(), nn: /NOT\s+NULL/i.test(c[3]), n: (c[4] || '').trim() || c[1] }); });
      tables.push(tb);
    }
    const fks = []; const fre = /ALTER\s+TABLE\s+(?:\w+\.)?(\w+)\s+ADD\s+CONSTRAINT\s+\w+\s+FOREIGN\s+KEY\s*\(([^)]*)\)\s*REFERENCES\s+(?:\w+\.)?(\w+)/gi; while ((m = fre.exec(src))) fks.push({ child: m[1], cols: m[2].split(',').map(x => x.trim()), parent: m[3] });
    if (!tables.length) errs.unshift('CREATE TABLE 문을 찾지 못했습니다');
    return { tables, fks, errs };
  }
  const termNames = new Set(getDict().filter(x => x.k === 'term' && x.ver > 0).map(x => x.name));
  function preview() {
    parsed = parse($('ddl').value);
    const { tables, fks, errs } = parsed;
    $('pstate').innerHTML = errs.length && !tables.length ? '<span class="badge b-danger">읽기 실패</span>' : errs.length ? '<span class="badge b-warning">일부 경고</span>' : '<span class="badge b-success">읽음</span>';
    const cols = tables.reduce((n, x) => n + x.cols.length, 0);
    $('psum').textContent = tables.length ? `테이블 ${tables.length} · 컬럼 ${cols} · PK ${tables.filter(x => x.pk.length).length} · FK ${fks.length}` : '';
    $('prev').innerHTML = tables.map(tb => `<tr class="${tb.pk.length ? '' : 'row-warning'}"><td class="mono">${esc(tb.phys)}</td><td>${esc(tb.name)}</td><td class="num">${tb.cols.length}</td><td>${tb.pk.length ? '<i data-ic=check></i><span class="sr-only">있음</span>' : '—'}</td><td class="num">${fks.filter(f => f.child === tb.phys).length}</td><td>${tb.pk.length ? '<span class="badge b-success">정상</span>' : '<span class="badge b-warning">PK 없음</span>'}</td></tr>`).join('') + errs.map(x => `<tr class="row-danger"><td colspan="6" class="caption">${esc(x)}</td></tr>`).join('') || '<tr class="er first"><td colspan="6" class="caption muted u-tc u-p-32">결과 없음</td></tr>';
    $('go').disabled = !tables.length || !canImport; $('go').textContent = tables.length ? `${tables.length}개 테이블 가져오기` : '가져오기';
    // one primary per screen (01 v2 §1-2): the step you are on — parse first, then import
    $('go').classList.toggle('primary', !$('go').disabled); $('parse').classList.toggle('primary', $('go').disabled);
    $('foot-note').textContent = tables.filter(x => !x.pk.length).length ? `PK 없는 테이블 ${tables.filter(x => !x.pk.length).length}개는 경고와 함께 가져옵니다` : '';
  }
  // structure for the model: attribute status from the dictionary as it is now
  function toModel() {
    const E = [], R = []; const idOf = {};
    parsed.tables.forEach((tb, i) => { const id = 'i' + i; idOf[tb.phys] = id;
      E.push({ id, n: tb.name, p: tb.phys, c: tb.phys.endsWith('_M') ? 'M' : tb.phys.endsWith('_D') ? 'A' : 'K', x: 60 + (i % 3) * 380, y: 60 + Math.floor(i / 3) * 300, px: 60 + (i % 3) * 400, py: 60 + Math.floor(i / 3) * 320,
        a: tb.cols.map(c => ({ n: c.n, p: c.p, t: c.t, pk: tb.pk.includes(c.p) ? 1 : 0, nn: c.nn ? 1 : 0, s: termNames.has(c.n) ? 'ok' : decompose(c.n).ok ? 'comb' : 'unreg' })) }); });
    parsed.fks.forEach(f => { const c = E.find(x => x.id === idOf[f.child]); if (!c || !idOf[f.parent]) return; R.push({ f: idOf[f.parent], t: idOf[f.child], k: 'nonid', name: '' }); c.a.forEach(a => { if (f.cols.includes(a.p)) a.fk = 1; }); });
    return { E, R, M: [] };
  }
  $('ex-file').onclick = () => { cancelRead(); $('ddl').value = SAMPLE; preview(); };
  // FC-11: choose a .sql file → its text fills the box and the same preview runs; a file that cannot be read (too big · not text · read error) shows ‘파일 읽기 실패’ and keeps the box as it was
  $('pick-file').onclick = () => $('sql-file').click();
  // NEW-03: every read gets a number — only the latest read may fill the box; any other way of filling it (예시 · 읽기) cancels a read still running; [가져오기] waits
  let readTok = 0, reading = false; const cancelRead = () => { readTok++; reading = false; };
  $('sql-file').onchange = () => { const f = $('sql-file').files && $('sql-file').files[0]; if (!f) return; $('sql-file').value = '';
    const tok = ++readTok; reading = true; $('go').disabled = true; $('go').classList.remove('primary'); $('pstate').innerHTML = '<span class="badge">읽는 중</span>';
    const fail = why => { if (tok !== readTok) return; reading = false; $('pstate').innerHTML = '<span class="badge b-danger">파일 읽기 실패</span>'; $('psum').textContent = ''; $('prev').innerHTML = `<tr class="row-danger"><td colspan="6" class="caption">${esc(f.name)} — ${esc(why)}</td></tr>`; parsed = null; $('go').disabled = true; $('go').classList.remove('primary'); $('parse').classList.add('primary'); toast(`‘${esc(f.name)}’을(를) 읽지 못했습니다 — ${esc(why)}`, 'danger'); };
    if (f.size > 2 * 1024 * 1024) { fail('2MB를 넘는 파일은 읽지 않습니다'); return; }
    const rd = new FileReader(); rd.onerror = () => fail('파일을 읽는 중 오류가 났습니다'); rd.onload = () => { if (tok !== readTok) return; reading = false; const t = String(rd.result || ''); if (/\u0000/.test(t)) { fail('텍스트(.sql) 파일이 아닙니다'); return; } $('ddl').value = t; preview(); toast(`‘${esc(f.name)}’을(를) 읽었습니다 — 미리보기를 확인하세요`, 'info'); }; rd.readAsText(f, 'utf-8'); };
  $('ex-bad').onclick = () => { cancelRead(); $('ddl').value = 'SELECT * FROM RQMS.RQRM_D;'; preview(); };
  $('parse').onclick = () => { cancelRead(); preview(); };
  // the area list only matters for "기존 업무 영역에 추가" — greyed out otherwise; the area we came from is preselected when it can take edits
  const syncDst = () => { const v = document.querySelector('[name=dst]:checked').value; $('newname-f').style.display = v === 'new' ? '' : 'none'; $('dst-area').disabled = v !== 'cur'; };
  if (FROM && modelLock(FROM).state === 'edit') $('dst-area').value = FROM;
  document.querySelectorAll('[name=dst]').forEach(r => r.onchange = syncDst); syncDst();
  $('go').onclick = () => {
    if (!parsed || !parsed.tables.length || !canImport || reading) return;   // NEW-03: not while a file is still being read
    if (liveRoleChanged()) { staleRoleToast(); return; }
    const dst = document.querySelector('[name=dst]:checked').value; const st = toModel(); let area;
    if (dst === 'new') { const nm = $('newname').value.trim(); if (!nm) { toast('새 업무 영역 이름을 입력하세요', 'danger'); $('newname').focus(); return; } area = addArea(nm, st); }
    else { area = $('dst-area').value; const L = modelLock(area); if (L.state !== 'edit') { toast('그 업무 영역은 지금 편집할 수 없습니다', 'danger'); return; } const cur = modelOf(area, L.model.ver); const base = cur.E.length; st.E.forEach((x, i) => { x.id = 'imp' + Date.now() % 10000 + i; x.x += 900; x.px += 900; }); const map = {}; parsed.tables.forEach((tb, i) => { map['i' + i] = st.E[i].id; }); st.R.forEach(r => { r.f = map[r.f]; r.t = map[r.t]; }); const old = getModelData(area, L.model.ver); setModelData(area, L.model.ver, Object.assign({}, cur, { E: cur.E.concat(st.E), R: cur.R.concat(st.R), rev: ((old && old.rev) || 0) + 1 })); }
    // F-017: the record names itself (id · ISO time · source) and the link to 표준 맞추기 carries its id — that screen uses it once, matched by id
    const IMP = typeof window.newId === 'function' ? newId('imp') : 'imp_' + Date.now().toString(36);
    dbmStore.set('dbm-import-last', JSON.stringify({ id: IMP, at: new Date().toISOString(), src: 'ddl', area, dst, tables: parsed.tables.length, cols: parsed.tables.reduce((n, x) => n + x.cols.length, 0) }));
    go(`standardize.html?area=${area}&from=import&imp=${encodeURIComponent(IMP)}`);
  };
  $('ddl').value = SAMPLE; preview();
};
</script>
</body>
</html>
