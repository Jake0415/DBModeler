<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>후보 큐 · NeoDB 목업</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="assets/app.css">
<script src="assets/app.js"></script>
</head>
<body data-page="candidates">
<div id="app">
<div id="content" class="page">
  <div class="page-header">
    <h1>후보 큐</h1>
    
    <div class="actions"></div>
  </div>
  <div class="page-body">
    <div class="main">
      <div class="toolbar" id="cfilt"></div>
      <div class="listhead" id="clh"></div>
      <div class="scroll">
        <table class="tbl">
          <thead><tr><th>유형</th><th>이름</th><th>제안 약어</th><th class="num">발생</th><th>최초 요청</th><th>상태</th><th>유사 표준어</th></tr></thead>
          <tbody id="crows"></tbody>
        </table>
      </div>
    </div>
    <aside class="rpanel" id="pn-cand">
      <div class="rp-head">
        <div class="t"><span class="badge b-violet" id="cd-type">단어 후보</span><span class="badge" id="cd-st">대기</span><button class="iconbtn close u-w-28 u-h-28" data-close="pn-cand" aria-label="상세 닫기 — 후보는 그대로" title="상세 닫기 — 후보는 그대로"><i data-ic=x></i></button></div>
        <h2 class="u-mt-8" id="cd-name"></h2><div class="rp-sub" id="cd-abbr"></div>
      </div>
      <div class="rp-body" id="cd-body"></div>
      <div class="rp-foot" id="cd-foot"></div>
    </aside>
  </div>
  <div class="overlay" id="mo-crej" role="dialog" aria-modal="true" aria-labelledby="crej-t"><div class="modal"><div class="m-head"><h3 id="crej-t">후보 반려 · 수령자</h3></div>
    <div class="m-body"><div class="caption muted u-mb-8">발생 위치 4곳의 요청자 <b>김모델 · 박설계</b>에게 앱 알림이 갑니다. 해당 속성은 미준수로 남습니다.</div>
      <div class="field"><label for="crej-why">반려 사유 *</label><textarea class="input" id="crej-why" rows="3"></textarea></div></div>
    <div class="m-foot"><button class="btn" data-close="mo-crej">취소</button><button class="btn danger" id="crej-go" data-needs="crej-why">반려</button></div></div></div>
  <div class="overlay" id="mo-cstd" role="dialog" aria-modal="true" aria-labelledby="cstd-t"><div class="modal"><div class="m-head"><h3 id="cstd-t">기존 표준어 사용 안내</h3></div>
    <div class="m-body"><div class="field"><label for="cstd-to">안내할 표준</label><select class="input" id="cstd-to"><option>수신자 RCVR (공통 단어)</option><option>수취인 RCPT (기관 단어)</option></select></div>
      <div class="field"><label for="cstd-msg">요청자에게 보낼 안내 *</label><textarea class="input" id="cstd-msg" rows="3">‘수령자’ 대신 같은 뜻의 공통 표준 ‘수신자(RCVR)’를 쓰세요. 표준 맞추기에서 바로 바꿀 수 있습니다.</textarea></div>
      <div class="caption muted">요청자 2명 · 발생 위치 4곳에 ‘수신자로 바꾸기’ 제안이 붙습니다.</div></div>
    <div class="m-foot"><button class="btn" data-close="mo-cstd">취소</button><button class="btn primary" id="cstd-go" data-needs="cstd-msg">안내하고 후보 닫기</button></div></div></div>
</div>
</div>
<script>
window.pageInit = function () {
  const $ = id => document.getElementById(id);
  const q = new URLSearchParams(location.search);
  // candidates come from the shared store: model/standardize register them, this queue processes them (CX13-03)
  const FS = ['전체', '대기', '신청 전환', '등록 완료', '반려', '기존 표준어 안내'];
  let C = getCands(); let f = FS.includes(q.get('f')) ? q.get('f') : '대기', sel = q.get('sel') || q.get('c') || null;   // c= is the old deep-link key (alias)
  const reqs = c => [...new Set(c.loc.map(l => l.by))];
  const ST_BADGE = { 대기: '', '신청 전환': 'b-info', '등록 완료': 'b-success', 반려: 'b-danger', '기존 표준어 안내': '' };
  const locHref = l => l.area && getModels()[l.area] ? `model.html?area=${l.area}${l.e ? '&focus=' + l.e : ''}` : null;
  function draw() {
    C = getCands();
    const counts = {}; C.forEach(c => { const s = candState(c); counts[s] = (counts[s] || 0) + 1; });
    // list standard: '전체' first; '대기' (the default) is the work queue
    $('cfilt').innerHTML = `<span class="flex u-gap-8" role="group" aria-label="후보 상태">${FS.map(k => `<button class="chip ${f === k ? 'on' : ''}" data-cf="${k}">${k} <span class="n">${k === '전체' ? C.length : counts[k] || 0}</span></button>`).join('')}</span><span class="grow"></span><span class="caption muted">상태는 연결된 결재 문서를 따릅니다</span>`;
    const L = C.filter(c => f === '전체' || candState(c) === f);
    $('clh').innerHTML = `<b class="u-fg">${f === '대기' ? `${L.length}건` : `${C.length}건 중 ${L.length}건`}</b> · 같은 이름은 한 행으로 묶어 발생 위치를 표시합니다${f !== '대기' ? ` <span class="fchips"><button class="fchip" data-cclr="1" aria-label="상태 필터 지우기">상태: ${f}<i data-ic=x data-s=12></i></button></span>` : ''}`;
    // L-9: only the work queue ('대기') auto-selects its first candidate; other states open the panel on pick
    if (sel && !L.some(c => c.id === sel)) sel = null;
    if (!sel && f === '대기') sel = (L[0] || {}).id || null;
    liveCount(`${L.length}건`);
    urlSync(['f', 'sel', 'c'], { f: f === '대기' ? '' : f, sel: sel || '' });
    $('pn-cand').classList.toggle('open', !!sel);
    $('crows').innerHTML = L.map(c => `<tr class="click ${sel === c.id ? 'sel' : ''}" data-c="${c.id}" tabindex="0"><td><span class="muted">${c.t}</span></td><td><b>${c.name}</b></td><td class="mono">${c.abbr || '—'}</td><td class="num">${c.loc.length}</td><td>${USERS[(c.loc[0] || {}).by] ? USERS[c.loc[0].by].name : '—'}</td><td><span class="badge ${ST_BADGE[candState(c)]}">${candState(c)}</span>${c.doc ? ` <a class="mono caption" href="approvals.html?doc=${c.doc}">${c.doc}</a>` : ''}</td><td>${c.sim ? `<span class="muted">${c.sim[2]}</span> ${c.sim[0]} <span class="mono faint">${c.sim[1]}</span>` : '<span class="faint">없음</span>'}</td></tr>`).join('') || (f === '대기' && C.length   // L-6: 'done' only when the default queue is empty
      ? '<tr class="er done"><td colspan="7" class="caption muted u-tc u-p-32"><span class="et">대기 중인 후보를 모두 처리했습니다</span>새 후보가 등록되면 알림으로 알려 드립니다.</td></tr>'
      : !C.length ? '<tr class="er first"><td colspan="7" class="caption muted u-tc u-p-32"><span class="et">아직 등록된 후보가 없습니다</span>모델 · 표준 맞추기에서 사전에 없는 단어 · 용어를 후보로 올리면 여기에 모입니다.</td></tr>'
      : `<tr class="er none"><td colspan="7" class="caption muted u-tc u-p-32"><span class="et">‘${f}’ 후보가 없습니다</span><button class="btn sm ghost" data-cclr="1">모두 지우기</button></td></tr>`);
    panel();
  }
  function panel() {
    const c = C.find(x => x.id === sel); $('cd-type').hidden = $('cd-st').hidden = !c;   // the badges kept the last candidate's kind/state on an empty filter
    if (!c) { $('cd-abbr').textContent = ''; $('cd-name').textContent = '후보를 고르세요'; $('cd-body').innerHTML = ''; $('cd-foot').innerHTML = ''; return; }
    const st = candState(c);
    $('cd-type').textContent = c.t + ' 후보'; $('cd-st').textContent = st; $('cd-st').className = 'badge ' + ST_BADGE[st];
    $('cd-name').textContent = c.name; $('cd-abbr').textContent = c.abbr ? '제안 약어 ' + c.abbr : '제안 약어 없음 — 전환할 때 정합니다';
    // an open request that already covers this name is shown up front (CL12-24)
    const op = openItems().find(o => o.it.name === c.name && (o.it.act || '추가') === '추가' && o.doc !== c.doc);
    $('cd-body').innerHTML = `${op ? `<div class="banner info"><i data-ic=info></i><div class="grow">이미 <b>${op.doc}</b>에서 같은 이름을 신청 중입니다. 새 신청 대신 이 신청에 연결하세요.</div><a class="btn sm" href="approvals.html?doc=${op.doc}">결재 보기</a></div>` : ''}
      ${c.sim ? `<div class="banner warning u-mt-8"><i data-ic=warn></i><div class="grow">비슷한 표준어가 있습니다: <b>${c.sim[0]}</b> <span class="mono">${c.sim[1]}</span> (${c.sim[2]}). 같은 뜻이면 기존 단어를 쓰도록 안내하세요.</div></div>` : ''}
      ${c.closed ? `<div class="banner u-mt-8"><i data-ic=info></i><div>${c.closed} — ${c.closedWhy || ''}</div></div>` : ''}
      <div class="section-t">발생 위치 <span class="badge">${c.loc.length}</span></div>
      <table class="tbl"><thead><tr><th>위치</th><th>속성</th><th>등록</th></tr></thead><tbody>${c.loc.map(l => `<tr><td class="wrap">${locHref(l) ? `<a href="${locHref(l)}">${(getModels()[l.area] || {}).name} › ${l.ent}</a>` : `${l.sys || '다른 시스템'} › ${l.ent}`}</td><td>${l.attr}</td><td>${USERS[l.by] ? USERS[l.by].name : l.by}</td></tr>`).join('')}</tbody></table>
      <div class="section-t">처리 결과는 요청자 ${reqs(c).map(u => USERS[u] ? USERS[u].name : u).join(' · ')}에게 앱 알림으로 갑니다</div>`;
    // 권한표: 역할 있음 + 임시 비밀번호 = 흐리게 + 이유(rbac-matrix cand.decide '임시PW'), 역할 없음 = 숨김
    const me0 = USERS[ME.id] || ME;
    if (!can('cand.decide') && me0.pwTemp && (me0.roles || []).includes('da') && st === '대기') {
      const why = '임시 비밀번호를 바꾼 뒤 처리할 수 있습니다';
      $('cd-foot').innerHTML = `<button class="btn danger sm" disabled aria-disabled="true" title="${why}">반려</button><span class="grow"></span><span class="caption muted">${why} — <a href="mypage.html#security">마이페이지에서 바꾸기</a></span><button class="btn primary sm" disabled aria-disabled="true" title="${why}">${c.t} 신청으로 전환</button>`;
      return;
    }
    if (!can('cand.decide')) { $('cd-foot').innerHTML = '<span class="caption muted">후보 처리는 DA만 할 수 있습니다 — 내가 등록한 후보의 처리 결과는 알림으로 받습니다.</span>'; return; }
    if (st !== '대기') { $('cd-foot').innerHTML = `<span class="badge ${ST_BADGE[st]}">${st}</span>${c.doc ? ` <a class="btn sm" href="approvals.html?doc=${c.doc}">결재 보기</a>` : ''}<span class="grow"></span>${c.closed ? '<button class="btn sm" id="c-reopen">다시 열기</button>' : ''}`; const ro = $('c-reopen'); if (ro) ro.onclick = () => { const all = getCands(); const x = all.find(y => y.id === c.id); delete x.closed; delete x.closedWhy; saveCands(all); draw(); }; return; }
    // conversion opens the registration form (PN-12) filled with the candidate — domain / description are checked there (CL12-25)
    $('cd-foot').innerHTML = `<button class="btn danger sm" data-open="mo-crej">반려</button>${c.sim ? '<button class="btn sm" data-open="mo-cstd">기존 표준어 사용 안내</button>' : ''}<span class="grow"></span>${op ? `<button class="btn sm" id="c-link">${op.doc}에 연결</button>` : ''}<a class="btn primary sm" href="dictionary.html?cand=${c.id}">${c.t} 신청으로 전환</a>`;
    const lk = $('c-link'); if (lk) lk.onclick = () => { if (liveRoleChanged()) { staleRoleToast(); return; } const all = getCands(); all.find(y => y.id === c.id).doc = op.doc; saveCands(all); notify(c, `${op.doc}에 연결`); toast(`${c.name} 후보를 ${op.doc}에 연결했습니다`, 'success'); draw(); };
    $('crej-t').textContent = `후보 반려 · ${c.name}`;
    document.querySelector('#mo-crej .m-body .caption').innerHTML = `발생 위치 ${c.loc.length}곳의 요청자 <b>${reqs(c).map(u => USERS[u] ? USERS[u].name : u).join(' · ')}</b>에게 앱 알림이 갑니다. 해당 속성은 미준수로 남습니다.`;
    if (c.sim) { $('cstd-to').innerHTML = `<option>${c.sim[0]} ${c.sim[1]} (${c.sim[2]} 단어)</option>`; $('cstd-msg').value = `‘${c.name}’ 대신 같은 뜻의 ${c.sim[2]} 표준 ‘${c.sim[0]}(${c.sim[1]})’를 쓰세요. 표준 맞추기에서 바로 바꿀 수 있습니다.`;
      document.querySelector('#mo-cstd .m-body > .caption').textContent = `요청자 ${reqs(c).length}명 · 발생 위치 ${c.loc.length}곳에 ‘${c.sim[0]}${josa(c.sim[0], '으로/로').slice(c.sim[0].length)} 바꾸기’ 제안이 붙습니다.`; }   // was a fixed '수령자 → 수신자' sentence
  }
  const notify = (c, label) => pushNotif({ to: reqs(c), k: 'cand', t: `후보 ‘${c.name}’ — ${label}`, m: `${ME.name} 처리`, href: `candidates.html?c=${c.id}` });
  const close = (label, why) => { if (liveRoleChanged()) { staleRoleToast(); return; } const all = getCands(); const c = all.find(y => y.id === sel); c.closed = label; c.closedWhy = why; saveCands(all); notify(c, label); pushAudit({ act: `후보 ${label}`, target: c.name, why }); toast(`${c.name}: ${label} — 요청자 ${reqs(c).length}명에게 알림`, label === '반려' ? 'danger' : 'info'); draw(); };
  $('crej-go').onclick = () => { $('mo-crej').classList.remove('open'); close('반려', $('crej-why').value.trim()); $('crej-why').value = ''; };
  $('cstd-go').onclick = () => { $('mo-cstd').classList.remove('open'); close('기존 표준어 안내', $('cstd-msg').value.trim()); };
  $('cfilt').addEventListener('click', e => { const b = e.target.closest('[data-cf]'); if (!b) return; f = b.dataset.cf; sel = null; draw(); });
  $('crows').addEventListener('click', e => { const r = e.target.closest('tr[data-c]'); if (!r || e.target.closest('a')) return; sel = r.dataset.c; draw(); const n = document.querySelector(`#crows tr[data-c="${sel}"]`); if (n) n.focus(); });
  // 모두 지우기 = back to the default queue (대기)
  document.addEventListener('click', e => { if (!e.target.closest('[data-cclr]')) return; f = '대기'; sel = null; draw(); const b = document.querySelector('#cfilt .chip.on'); if (b) b.focus(); });
  // the panel's close button also drops the selection (so the address and the next draw agree); focus returns to the row
  document.querySelector('#pn-cand [data-close="pn-cand"]').addEventListener('click', () => { const back = sel; sel = null; setTimeout(() => { draw(); const r = document.querySelector(`#crows tr[data-c="${back}"]`); if (r) r.focus(); }, 0); });
  if (q.get('c')) { const c = C.find(x => x.id === q.get('c')); if (c) f = candState(c); }
  draw();
};
</script>
</body>
</html>
