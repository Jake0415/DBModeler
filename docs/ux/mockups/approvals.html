<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>결재함 · DBModeler 목업</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="assets/app.css">
<script src="assets/app.js"></script>
<style>
  .diff-old{color:var(--danger-deep);text-decoration:line-through}.diff-new{color:var(--success-deep);font-weight:500}
  .foot-zone { display:flex; align-items:center; gap:8px; }
  .foot-zone .zl { font-size:12px; color:var(--fg-2); }
  .doclinks { display:flex; gap:6px; flex-wrap:wrap; margin:12px 0 4px; }
  #rows tr.dim td { color:var(--fg-2); }
  .items-t { table-layout:fixed; width:100%; } .items-t td, .items-t th { white-space:normal; overflow-wrap:anywhere; vertical-align:top; }
  .items-t col.c1 { width:34px; } .items-t col.c2 { width:92px; } .items-t col.c4 { width:26%; }
</style>
</head>
<body data-page="approvals">
<div id="app">
<div id="content" class="page">
  <div class="page-header">
    <h1>결재함</h1>
    <div class="actions" id="boxes"></div>
  </div>
  <div class="page-body">
    <div class="main">
      <div class="pad" style="padding-bottom:0" id="new-banner" hidden></div>
      <div class="toolbar">
        <select class="input" id="f-type" style="width:160px;height:28px" aria-label="문서 유형"><option value="">문서 유형: 전체</option><option value="dict">사전 신청</option><option value="model">모델 확정</option></select>
        <select class="input" id="f-step" style="width:150px;height:28px" aria-label="단계"><option value="">단계: 전체</option><option value="da">DA 승인</option><option value="final">최종 승인</option><option value="done">완료</option><option value="rejected">반려됨</option><option value="withdrawn">회수됨</option></select>
        <div class="search" style="flex-basis:280px"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><input class="input" id="f-q" placeholder="신청번호·제목·요청자" style="height:28px" aria-label="신청번호·제목·요청자 검색"></div>
        <span class="grow"></span><span class="caption muted" id="boxhint"></span>
      </div>
      <div class="scroll">
        <table class="tbl">
          <thead><tr><th>신청번호</th><th>유형</th><th>제목</th><th>요청자</th><th>현재 단계</th><th>건수</th><th>신청일</th></tr></thead>
          <tbody id="rows"></tbody>
        </table>
      </div>
    </div>
    <aside class="rpanel wide" id="pn-doc" data-tabscope aria-label="결재 문서"></aside>
  </div>

  <!-- MO-22 self approval -->
  <div class="overlay" id="mo-self" role="dialog" aria-modal="true" aria-labelledby="self-t"><div class="modal">
    <div class="m-head"><h3 id="self-t">자기 승인</h3></div>
    <div class="m-body">
      <div class="banner violet" style="margin-bottom:12px"><span>◆</span><div>본인이 신청한 문서를 <b id="self-step">DA</b> 단계에서 승인합니다. 사유는 결재 이력과 감사 로그에 <b>‘자기 승인’</b>으로 남습니다.</div></div><label class="flex caption" id="self-ack-w" hidden style="margin-bottom:8px"><input type="checkbox" id="self-ack"> <span id="self-ack-t"></span></label>
      <div class="field"><label for="self-why">자기 승인 사유 *</label><textarea class="input" id="self-why" rows="3"></textarea></div>
    </div>
    <div class="m-foot"><button class="btn" data-close="mo-self">취소</button><button class="btn primary" id="do-self" data-needs="self-why">사유 남기고 승인</button></div>
  </div></div>
  <!-- MO-24 approve -->
  <div class="overlay" id="mo-apr" role="dialog" aria-modal="true" aria-labelledby="apr-t"><div class="modal">
    <div class="m-head"><h3 id="apr-t">승인</h3></div>
    <div class="m-body"><div id="apr-sum" class="caption" style="margin-bottom:8px"></div>
      <div class="field"><label for="apr-note">승인 의견 <span class="faint">선택 · 이력에 남습니다</span></label><textarea class="input" id="apr-note" rows="2"></textarea></div><label class="flex caption" id="apr-ack-w" hidden style="margin-top:6px"><input type="checkbox" id="apr-ack"> <span id="apr-ack-t"></span></label></div>
    <div class="m-foot"><button class="btn" data-close="mo-apr">취소</button><button class="btn primary" id="do-apr">승인</button></div>
  </div></div>
  <!-- MO-23 reject -->
  <div class="overlay" id="mo-reject" role="dialog" aria-modal="true" aria-labelledby="rej-t"><div class="modal">
    <div class="m-head"><h3 id="rej-t">반려</h3></div>
    <div class="m-body"><div class="field"><label for="rej-why">반려 의견 * <span class="faint">신청자에게 앱 알림으로 전달됩니다</span></label><textarea class="input" id="rej-why" rows="3" placeholder="보완할 내용을 적어 주세요"></textarea></div></div>
    <div class="m-foot"><button class="btn" data-close="mo-reject">취소</button><button class="btn danger" id="do-rej" data-needs="rej-why" data-needs-msg="반려 의견을 입력해야 합니다">반려</button></div>
  </div></div>
  <!-- MO-25 withdraw -->
  <div class="overlay" id="mo-wd" role="dialog" aria-modal="true" aria-labelledby="wd-t"><div class="modal">
    <div class="m-head"><h3 id="wd-t">회수</h3></div>
    <div class="m-body"><div class="caption muted" style="margin-bottom:8px">회수하면 결재가 취소되고, 모델 확정이면 업무 영역 잠금이 풀려 다시 편집할 수 있습니다.</div>
      <div class="field"><label for="wd-why">회수 사유 *</label><textarea class="input" id="wd-why" rows="2"></textarea></div></div>
    <div class="m-foot"><button class="btn" data-close="mo-wd">취소</button><button class="btn" id="do-wd" data-needs="wd-why">회수</button></div>
  </div></div>
  <!-- MO-26 diff -->
  <div class="overlay" id="mo-diff" role="dialog" aria-modal="true" aria-labelledby="diff-t"><div class="modal" style="width:720px">
    <div class="m-head"><div class="flex"><h3 id="diff-t">직전 확정본 대비 변경</h3><span class="grow"></span><button class="iconbtn" data-close="mo-diff" aria-label="닫기" style="width:28px;height:28px">×</button></div></div>
    <div class="m-body" style="max-height:60vh;overflow:auto" id="diff-body"></div>
    <div class="m-foot"><a class="btn" id="diff-erd" href="model.html">ERD로 보기</a><button class="btn primary" data-close="mo-diff">닫기</button></div>
  </div></div>
</div>
</div>
<script>
window.pageInit = function () {
  const $ = id => document.getElementById(id);
  const q = new URLSearchParams(location.search);
  let docs = getDocs();
  const nameOf = id => USERS[id] ? USERS[id].name : id;
  const inQueue = d => (d.step === 'da' && ME.has('da')) || (d.step === 'final' && ME.has('owner'));
  const BOX = {
    queue: ['대기함', d => inQueue(d)],
    mine: ['내 신청', d => d.req === ME.id],
    cc: ['참조함', d => (d.cc || []).includes(ME.id)],
    all: ['전체', d => ME.has('da') || ME.has('owner') || d.req === ME.id || (d.cc || []).includes(ME.id)]
  };
  let box = q.get('box') || (ME.has('da') || ME.has('owner') ? 'queue' : 'mine');
  if (box === 'queue' && !(ME.has('da') || ME.has('owner'))) box = 'mine';
  let sel = null;
  const stepRole = s => s === 'da' ? 'DA' : s === 'final' ? '기관 담당자' : '';
  const stBadge = d => `<span class="badge ${d.step === 'rejected' ? 'b-danger' : d.step === 'done' ? 'b-success' : d.step === 'withdrawn' ? '' : 'b-info'}">● ${STEP_NAME[d.step]}</span>`;

  function drawBoxes() {
    $('boxes').innerHTML = Object.entries(BOX).filter(([k]) => k !== 'all' && (k !== 'queue' || ME.has('da') || ME.has('owner'))).map(([k, [l, f]]) => `<button class="chip ${box === k ? 'on' : ''}" data-box="${k}">${l} <span class="n">${docs.filter(f).length}</span></button>`).join('');
    $('boxhint').textContent = box === 'queue' ? (ME.has('da') || ME.has('owner') ? `지금 내 역할(${ME.roles.filter(r => r === 'da' || r === 'owner').map(r => ROLE_NAME[r]).join('·')}) 차례인 문서만` : '결재 역할이 없습니다') : box === 'mine' ? '내가 신청한 문서 · 회수·보완' : '참조로 지정된 문서 · 조회 전용';
  }
  function list() {
    const ft = $('f-type').value, fs = $('f-step').value, fq = $('f-q').value.trim();
    return docs.filter(BOX[box][1]).filter(d => (!ft || d.type === ft) && (!fs || d.step === fs) && (!fq || (d.id + d.title + nameOf(d.req)).includes(fq)));
  }
  function drawRows() {
    const L = list();
    $('rows').innerHTML = L.length ? L.map(d => `<tr class="click ${sel === d.id ? 'sel' : ''} ${['done', 'withdrawn', 'rejected'].includes(d.step) ? 'dim' : ''}" data-id="${d.id}" tabindex="0"><td class="mono">${d.id}</td><td><span class="badge ${d.type === 'model' ? 'b-violet' : ''}">${d.type === 'model' ? '모델 확정' : '사전 신청'}</span></td><td>${d.title}</td><td>${nameOf(d.req)}${d.req === ME.id ? ' <span class="badge">나</span>' : ''}</td><td>${stBadge(d)}</td><td class="num">${d.n}</td><td class="mono">${d.date}</td></tr>`).join('')
      : `<tr><td colspan="7" style="text-align:center;padding:40px" class="caption muted">${box === 'queue' ? '지금 처리할 결재가 없습니다.' : '조건에 맞는 문서가 없습니다.'} ${($('f-type').value || $('f-step').value || $('f-q').value) ? '<button class="btn sm ghost" id="f-clear">필터 지우기</button>' : ''}</td></tr>`;
    const c = $('f-clear'); if (c) c.onclick = () => { $('f-type').value = ''; $('f-step').value = ''; $('f-q').value = ''; drawRows(); };
  }
  function line(d) {
    const h = d.hist || [];
    const daH = h.find(x => x.step === 'da'), fH = h.find(x => x.step === 'final');
    const cls = s => (d.step === s ? 'cur' : (s === 'da' && ['final', 'done'].includes(d.step)) || (s === 'final' && d.step === 'done') ? 'done' : '');
    const who = (x, s) => x ? `${x.who} · ${x.at}${x.self ? ' <span class="badge b-violet">자기 승인</span>' : ''}` : d.step === s ? (inQueue(d) ? '<b>내 차례</b>' : `${stepRole(s)} 처리 대기`) : '';
    return `<div class="approval-line">
      <div class="al-step done"><span class="pt"></span><div><b>신청</b><div class="caption muted">${nameOf(d.req)} · ${d.date}</div></div></div>
      <div class="al-step ${cls('da')}"><span class="pt"></span><div><b>DA 승인</b><div class="caption muted">${who(daH, 'da')}</div></div></div>
      ${hasFinal(d) ? `<div class="al-step ${cls('final')}"><span class="pt"></span><div><b>최종 승인 (기관 담당자)</b><div class="caption muted">${who(fH, 'final') || (d.type === 'model' ? '시스템 설정: 모델 확정 최종 승인 사용(신청 당시)' : '기관 설정: 사전 신청 최종 승인 사용(신청 당시)')}</div></div></div>` : '<div class="al-step done"><span class="pt"></span><div><b>최종 승인</b><div class="caption muted">신청 당시 설정: 최종 승인 사용 안 함 — DA 승인으로 완료</div></div></div>'}
    </div>`;
  }
  const KN = { word: '단어', term: '용어', domain: '도메인', code: '코드' };
  const opOf = it => it.act === '미사용' ? '미사용' : (it.id && it.act !== '추가') ? '변경' : '추가';
  // the rows the requester actually submitted (S1): op · fields before/after · per-row choice and reason
  function itemRows(d) {
    const L = d.items || [];
    if (!L.length) return `<div class="banner danger"><span>!</span><div>이 문서에는 반영할 항목이 없습니다 — 승인해도 사전이 바뀌지 않습니다. 반려 후 항목을 담아 다시 신청해야 합니다.</div></div>`;
    return `<table class="tbl items-t"><colgroup><col class="c1"><col class="c2"><col><col class="c4"><col></colgroup><thead><tr><th>${d.batch ? '행' : '#'}</th><th>구분</th><th>항목</th><th>약어 · 도메인</th><th>바뀌는 칸 / 선택·사유</th></tr></thead><tbody>${L.map((it, i) => {
      const op = opOf(it);
      const fields = it.chg ? Object.entries(it.chg).map(([k, v]) => `${k}: <span class="diff-old">${v[0] || '(빈 값)'}</span> → <span class="diff-new">${v[1]}</span>`).join('<br>') : '';
      const extra = [it.pick ? `분해 후보 선택: <b>${it.pick}</b>` : '', it.why ? `사유: ${it.why}` : '', it.warn ? `⚠ 경고 확인: ${it.warn}` : '', it.from ? `<span class="faint">${it.from}</span>` : ''].filter(Boolean).join('<br>');
      return `<tr><td class="mono">${it.row || i + 1}</td><td><span class="badge ${op === '추가' ? 'b-success' : op === '미사용' ? '' : 'b-info'}">${KN[it.k] || '항목'} · ${op}</span></td><td><b>${it.name}</b>${it.id ? ` <span class="mono faint">${it.id}</span>` : ''}</td><td class="mono">${it.abbr || ''}${it.dom ? ' · ' + it.dom : ''}</td><td class="caption wrap">${fields}${fields && extra ? '<br>' : ''}${extra || (fields ? '' : '—')}</td></tr>`; }).join('')}</tbody></table>
      ${d.sample ? `<div class="banner warning" style="margin-top:8px"><span>!</span><div>목업 시드: 이 문서는 ${d.n}건 중 <b>대표 ${L.length}행만</b> 담고 있습니다. 승인하면 이 ${L.length}행만 반영됩니다.</div></div>` : ''}`;
  }
  // check tab: same judgement as the final-approval re-check (checkDictDoc)
  function checks(d) {
    if (d.type === 'model') {
      const bad = modelBad(d.model); const s = d.snap || {}; const ended = reqEnded(d.model);
      return `<table class="tbl"><thead><tr><th>검사</th><th>신청 시점</th><th>제출 모델 재검사</th></tr></thead><tbody><tr><td>미준수 (조합 가능·미등록)</td><td>${s.bad != null ? s.bad + '건' : '—'}</td><td>${bad == null ? `<span class="caption muted">제출 사본 없음(목업 시드) — 신청 시점 값 ${s.bad != null ? s.bad + '건' : '0건'}으로 판정</span>` : bad ? `<span class="badge b-danger">${bad}건</span>` : '<span class="badge b-success">통과</span>'}</td></tr><tr><td>연결된 용어 신청</td><td>—</td><td>${ended.length ? `<span class="badge b-danger">반려·회수 ${ended.length}건</span> <span class="caption">${ended.join(', ')}</span>` : '<span class="badge b-success">통과</span>'}</td></tr><tr><td>표준 예외 (사유 기록)</td><td>${(s.exList || []).length}건</td><td>${d.model ? d.model.E.reduce((n, e) => n + e.a.filter(a => a.s === 'ex').length, 0) + '건' : '—'}</td></tr></tbody></table><div class="caption muted" style="margin-top:8px">승인은 <b>제출된 모델 사본</b>으로 다시 검사합니다(지금 작업 중인 모델이 아님).</div>`;
    }
    // finished documents show what the approval applied — re-checking them against today's dictionary would only report themselves as duplicates
    if (d.step === 'done') { const a = d.applied || {}; return `<div class="banner success"><span>✓</span><div>최종 승인 때 검사를 통과해 반영했습니다 — 반영 ${a.applied != null ? a.applied : (d.items || []).length}건${a.failed && a.failed.length ? ` · 실패 ${a.failed.length}건(${a.failed.map(f => f.join(': ')).join(', ')})` : ''}. 반영 뒤 바뀐 내용은 <a href="dict-history.html">사전 변경 내역</a>에서 확인하세요.</div></div>`; }
    const R = checkDictDoc(d);
    if (!R.length) return '<div class="caption muted">검사할 항목이 없습니다.</div>';
    const pol = getPolicy(); const pv = `<div class="caption muted" style="margin-bottom:6px">검수 기준: 신청 시점 v${d.policyVer || '—'} · 현재 v${pol.ver}${d.policyVer && d.policyVer !== pol.ver ? ' — <b style="color:var(--warning-deep)">신청 뒤 기준이 바뀌어 현재 기준으로 다시 검사합니다</b>' : ''}</div>`;
    const n = R.filter(r => r.problems.length).length;
    return pv + `<table class="tbl"><thead><tr><th>항목</th><th>구분</th><th>현재 사전 기준</th></tr></thead><tbody>${R.map(r => `<tr><td>${r.name}</td><td>${r.op}</td><td>${r.problems.length ? r.problems.map(p => `<span class="badge b-danger">${p}</span>`).join(' ') : '<span class="badge b-success">통과</span>'}</td></tr>`).join('')}</tbody></table><div class="caption ${n ? '' : 'muted'}" style="margin-top:8px">${n ? `<b style="color:var(--danger-deep)">${n}건 실패</b> — DA 승인과 최종 승인 모두 이 검사를 다시 하며, 실패가 있으면 승인하지 않고 이력에 남깁니다. 반려해 보완을 요청하세요.` : '승인할 때마다(DA·최종) 현재 사전 기준으로 다시 검사합니다.'}</div>`;
  }
  function items(d) {
    if (d.kind === 'excel') { const b = batchOf(d.batch) || { counts: {}, file: '—', id: '—' }; const c = b.counts || {}; const s = d.sub || {   /* frozen in the document at submit (S1) */ new: c.new || 0, chg: c.chg || 0, pick: c.pick || 0, conflict: 0, unuse: 0, hold: (c.waitDiff || 0) + (c.pre || 0), ex: (c.err || 0) + (c.same || 0) }; return `<div class="grid3" style="margin-bottom:8px;grid-template-columns:repeat(4,1fr)"><div class="card"><div class="caption muted">신규</div><div class="mono" style="font-size:20px">${s.new}</div></div><div class="card"><div class="caption muted">변경 <span class="faint">(충돌 해결 포함)</span></div><div class="mono" style="font-size:20px">${s.chg + s.conflict}</div></div><div class="card"><div class="caption muted">후보 확정</div><div class="mono" style="font-size:20px">${s.pick}</div></div><div class="card"><div class="caption muted">미사용</div><div class="mono" style="font-size:20px">${s.unuse}</div></div></div>
      <div class="caption muted" style="margin-bottom:6px">합계 ${s.new + s.chg + s.conflict + s.pick + s.unuse}건 = 이 문서 ${d.n}건 · 업로드 <a href="uploads.html?b=${b.id}">${b.id}</a> · ${b.file} · 기준본 ${d.baseline || b.baseline || '—'} · 보류 ${s.hold} · 제외 ${s.ex}</div>` + itemRows(d); }
    if (d.type === 'model') {
      const snap = d.snap || { rate: 100, bad: 0, exList: [] };
      const df = diffOf(d);

        if (d.batch) { const bs = getBatches(); const b = bs.find(x => x.id === d.batch); if (b) { b.status = '반영됨'; b.applied = { doc: d.id, ids: (d.items || []).map(it => it.name), at: nowStr() }; saveBatches(bs); } }
        notifyReq(`${d.id} 반영됨 — ${d.batch ? '반영본 내려받기' : '사전에 반영'}`, d.title + (d.batch ? ' · 엑셀 원본을 반영본으로 맞추세요' : ''));
        toast(`최종 승인 — 사전에 ${res.applied}건 반영${d.sample ? `(목업 시드: ${d.n}건 중 대표 행만)` : ''}${res.failed.length ? ` · 실패 ${res.failed.length}건` : ''} · 항목 버전이 올라갔습니다(제정차수는 DA 공표 때만)`, res.failed.length ? 'danger' : 'success', d.batch ? { label: '반영본 내려받기', fn: () => toast(`반영본_${d.batch}.xlsx — 새 버전·ID가 들어간 편집용 엑셀`, 'info') } : null);
      }
    } else if (kind === 'reject') {
      addHist(d, { act: '반려', why, step: d.step }); d.step = 'rejected'; saveDocs(docs);
      const rel = releaseDoc(d);   // pending markers of this document are released → the requester can re-request (CL9-07)
      notifyReq(`${d.id} 반려됨 — 보완 필요`, why);
      toast(`반려했습니다 — 신청자에게 의견과 함께 알렸습니다${rel ? ` · 사전 항목 ${rel}건의 '진행 중'을 풀었습니다` : ''}`, 'danger');
    } else if (kind === 'withdraw') {
      addHist(d, { act: '회수', why }); d.step = 'withdrawn'; saveDocs(docs);
      const rel = releaseDoc(d);
      toast(d.type === 'model' ? '회수했습니다 — 업무 영역 잠금이 풀려 다시 편집할 수 있습니다' : `회수했습니다${rel ? ` · 사전 항목 ${rel}건의 '진행 중'을 풀었습니다` : ''}`, 'info', d.type === 'model' ? { label: '모델 열기', fn: () => location.href = `model.html?area=${d.area}` } : { label: '보완해서 다시 신청', fn: () => location.href = d.batch ? `excel-import.html?resume=${d.batch}` : d.kind === 'std' ? `standardize.html?area=${d.area || 'rq'}&redo=${d.id}` : `dictionary.html?redo=${d.id}` });
    }
    pending = null; drawBoxes(); drawRows(); panel();
    const row = $('rows').querySelector(`tr[data-id="${sel}"]`); if (row) row.focus(); else { const pb = document.querySelector('#pn-doc .rp-head h2'); if (pb) { pb.tabIndex = -1; pb.focus(); } }   // focus returns after the dialog
  }
  $('do-self').onclick = () => { $('mo-self').classList.remove('open'); act('approve', $('self-why').value.trim(), true); };
  $('do-apr').onclick = () => { $('mo-apr').classList.remove('open'); act('approve', $('apr-note').value.trim(), false); };
  $('do-rej').onclick = () => { $('mo-reject').classList.remove('open'); act('reject', $('rej-why').value.trim()); $('rej-why').value = ''; };
  $('do-wd').onclick = () => { $('mo-wd').classList.remove('open'); act('withdraw', $('wd-why').value.trim()); $('wd-why').value = ''; };
  $('boxes').addEventListener('click', e => { const b = e.target.closest('[data-box]'); if (!b) return; box = b.dataset.box; sel = (list()[0] || {}).id || null; drawBoxes(); drawRows(); panel(); });
  $('rows').addEventListener('click', e => { const r = e.target.closest('tr[data-id]'); if (!r) return; sel = r.dataset.id; drawRows(); panel(); });
  $('rows').addEventListener('keydown', e => {
    const r = e.target.closest('tr[data-id]'); if (!r) return;
    if (e.key === 'Enter') { e.preventDefault(); e.stopPropagation(); sel = r.dataset.id; drawRows(); panel(); const n = $('rows').querySelector(`tr[data-id="${sel}"]`); if (n) n.focus(); }   // keep focus (CL4-01)
    if (e.key === 'ArrowDown' && r.nextElementSibling) { e.preventDefault(); r.nextElementSibling.focus(); }
    if (e.key === 'ArrowUp' && r.previousElementSibling) { e.preventDefault(); r.previousElementSibling.focus(); }
  });
  ['f-type', 'f-step'].forEach(id => $(id).onchange = drawRows); $('f-q').oninput = drawRows;

  // ?new=1&doc=ID — the source screen already created the document (createDoc); we only show it
  // the success banner only for a real, visible, still-open request of mine — not for any URL with new=1 (CX11-03 · CL11-03)
  const nd = q.get('new') && q.get('doc') ? docs.find(x => x.id === q.get('doc')) : null;
  if (q.get('new') && q.get('doc') && !(nd && canSeeDoc(nd) && nd.req === ME.id && ['da', 'final'].includes(nd.step))) {
    $('new-banner').hidden = false;
    $('new-banner').innerHTML = `<div class="banner ${nd ? 'info' : 'danger'}"><span>${nd ? 'ℹ' : '!'}</span><div class="grow">${nd && canSeeDoc(nd) ? `<b>${nd.id}</b>는 지금 ${STEP_NAME[nd.step]} 상태입니다 — 새 신청 결과 화면이 아닙니다.` : `<b>${q.get('doc')}</b> 신청을 찾을 수 없거나 볼 수 없습니다 — 신청이 만들어지지 않았을 수 있습니다. 내 신청에서 확인하세요.`}</div></div>`;
  } else if (q.get('new') && q.get('doc')) {
    const id = q.get('doc'), d = nd;
    $('new-banner').hidden = false;
    $('new-banner').innerHTML = `<div class="banner success"><span>✓</span><div class="grow"><b>${id} ${q.get('dup') ? '이미 신청돼 있습니다' : '신청됨'}</b> — ${d ? d.title : ''}. ${q.get('dup') ? '같은 내용의 진행 중 신청이 있어 새로 만들지 않았습니다.' : ME.has('da') ? 'DA 역할도 있어 바로 대기함에 들어왔습니다. 직접 승인하면 ‘자기 승인’으로 남습니다.' : 'DA에게 알렸습니다.'}</div></div>`;
    box = ME.has('da') ? 'queue' : 'mine';
  }
  if (q.get('doc')) { sel = q.get('doc'); const d = docs.find(x => x.id === sel); if (d && !BOX[box][1](d)) box = BOX.queue[1](d) ? 'queue' : BOX.mine[1](d) ? 'mine' : BOX.cc[1](d) ? 'cc' : 'all'; }
  if (!sel) sel = (list()[0] || {}).id || null;
  drawBoxes(); drawRows(); panel();
};
</script>
</body>
</html>
