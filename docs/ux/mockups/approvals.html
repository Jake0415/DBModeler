<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>결재함 · NeoDB 목업</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="assets/app.css">
<script src="assets/app.js"></script>
<style>
  .diff-old{color:var(--danger-deep);text-decoration:line-through}.diff-new{color:var(--success-deep);font-weight:500}
  .foot-zone { display:flex; align-items:center; gap:8px; }
  .sumline { display:flex; flex-wrap:wrap; align-items:center; gap:8px; margin-top:10px; font-size:14px; color:var(--fg-2); }
  .sumline b { color:var(--fg); font-weight:600; font-variant-numeric:tabular-nums; }
  .sumline .sep { width:1px; height:12px; background:var(--ds-gray-400); }
  .sumlink { border:0; height:24px; padding:0 10px; border-radius:9999px; font:500 12px var(--font-sans); cursor:pointer; background:var(--ds-gray-200); color:var(--fg); }
  .sumlink.err { background:var(--ds-red-200); color:var(--ds-red-900); }
  .sumlink:hover { text-decoration:underline; }
  .kbdh { display:flex; align-items:center; gap:4px; } .kbdh kbd { height:20px; font-size:12px; }
  .foot-zone .zl { font-size:12px; color:var(--fg-2); }
  .doclinks { display:flex; gap:6px; flex-wrap:wrap; margin:12px 0 4px; }
  #rows tr.dim td { color:var(--fg-2); }
  #rows td:nth-child(3) { white-space:normal; }
  /* A1: dictionary documents open a wide detail panel; the list yields its low-value columns */
  #pn-doc.dictw { width:680px; flex-basis:680px; }
  @media (min-width:1920px) { #pn-doc.dictw { width:760px; flex-basis:760px; } }
  .page-body:has(#pn-doc.open.dictw) #listwrap :is(th, td):is(:nth-child(2), :nth-child(8)) { display:none; }
  /* A1: each submitted item = a 2-line card. line 1 # · kind/op · name · action / line 2 abbr·domain or field diffs / full-width reject line */
  .itl { border-top:1px solid var(--border); }
  .it-row { padding:10px 4px; border-bottom:1px solid var(--border); }
  .it-row.rej { background:var(--ds-red-100); }
  .it-row.rej .it-nm { text-decoration:line-through; color:var(--fg-2); }
  .it-row.flash { box-shadow:inset 3px 0 0 var(--focus); background:var(--ds-blue-100); }
  .it-l1 { display:flex; align-items:center; gap:8px; min-width:0; }
  .it-l1 .no { width:32px; flex:0 0 32px; font-size:12px; color:var(--fg-3); }
  .it-l1 .it-nm { font-weight:600; }
  .it-l1 .grow { flex:1; }
  .it-l1 .btn { flex:0 0 auto; }
  .it-l2 { margin:4px 0 0 40px; font-size:12px; line-height:18px; color:var(--fg-2); overflow-wrap:anywhere; }
  .it-l2 .fk { color:var(--fg-3); }
  .it-l3 { margin:6px 0 0 40px; }
  .rej-f { display:flex; gap:6px; align-items:center; } .rej-f .input { flex:1; min-width:0; height:32px; font-size:12px; }
  .rej-why { color:var(--danger-deep); }
  .dep-ban { margin:8px 0 0 40px; }
  .dep-ban .btn { flex:0 0 auto; }
  /* A5: item filter row */
  #mo-diff .modal { width:720px; }   /* fixed widths live in the page style, not inline (17 §6.2) */
  .itf { display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin-bottom:8px; }
  .itf .search { flex:1 1 180px; min-width:160px; }
  /* A2: impact */
  .imp-n { font-variant-numeric:tabular-nums; }
  /* DX-21 stats */
  #stats { padding:16px 20px; }
  #tb[hidden], #listwrap[hidden], #stats[hidden] { display:none !important; }
  #stats .tbl :is(th, td) { white-space:normal; }   /* 1600: the 8-column requester table fits its grid cell */
  .stats-grid { display:grid; grid-template-columns:repeat(auto-fit, minmax(360px, 1fr)); gap:16px 24px; }
  /* 집계 redesign (2026-11-24): toolbar · KPI cards · two cards (waiting / state mix) · requester table */
  .st-bar { display:flex; flex-wrap:wrap; gap:8px 12px; align-items:center; margin-bottom:16px; }
  .kpi-row { display:grid; grid-template-columns:repeat(5, minmax(0, 1fr)); gap:12px; margin-bottom:16px; }
  .kpi { border:1px solid var(--border); border-radius:var(--r-lg); padding:12px 16px; background:var(--surface); }
  .kpi.warn { border-color:var(--ds-red-400); }
  .kpi-n { font:600 24px/32px var(--font-sans); font-variant-numeric:tabular-nums; color:var(--fg); }
  .kpi-l { font-size:13px; color:var(--fg); margin-top:2px; }
  .kpi-s { font-size:12px; color:var(--fg-2); margin-top:4px; display:flex; align-items:center; gap:4px; }
  .st-grid { display:grid; grid-template-columns:repeat(2, minmax(0, 1fr)); gap:16px; }
  .st-card { border:1px solid var(--border); border-radius:var(--r-lg); padding:14px 16px; background:var(--surface); min-width:0; }
  .st-card h3 { margin:0 0 10px; font-size:14px; font-weight:600; }
  .st-sub { font-size:12px; font-weight:600; color:var(--fg); margin:14px 0 6px; }
  .st-old { list-style:none; margin:0; padding:0; display:grid; gap:4px; }
  .st-old li { display:flex; gap:10px; align-items:center; font-size:13px; min-width:0; }
  .st-old li .grow { min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; color:var(--fg-2); }
  .st-stack { display:flex; height:12px; border-radius:6px; overflow:hidden; background:var(--surface-2); gap:2px; }
  .st-leg { list-style:none; margin:10px 0 0; padding:0; display:grid; grid-template-columns:repeat(2, minmax(0, 1fr)); gap:6px 16px; font-size:13px; }
  .st-leg li { display:flex; align-items:center; gap:8px; }
  .st-leg i { width:10px; height:10px; border-radius:2px; flex:none; }
  .st-leg b { margin-left:auto; font-weight:600; }
  .st-w { width:160px; }
  .statbar { display:block; width:100%; min-width:80px; height:6px; border:0; border-radius:3px; background:var(--surface-2); appearance:none; -webkit-appearance:none; overflow:hidden; }
  .statbar::-webkit-progress-bar { background:var(--surface-2); border-radius:3px; }
  .statbar::-webkit-progress-value { background:var(--ink); border-radius:3px; }
  .statbar::-moz-progress-bar { background:var(--ink); border-radius:3px; }
  .statbar.err::-webkit-progress-value { background:var(--danger); } .statbar.err::-moz-progress-bar { background:var(--danger); }
  .statbar.ok::-webkit-progress-value { background:var(--success); } .statbar.ok::-moz-progress-bar { background:var(--success); }
</style>
</head>
<body data-page="approvals">
<div id="app">
<div id="content" class="page">
  <div class="page-header">
    <h1>결재함</h1>
    <div class="seg u-ml-24" id="boxes" role="group" aria-label="결재함"></div>
  </div>
  <div class="page-body">
    <div class="main">
      <div class="pad u-pb-0" id="new-banner" hidden></div>
      <div class="toolbar" id="tb">
        <div class="search" style="flex-basis:280px"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><input class="input" id="f-q" placeholder="신청번호 · 제목 · 요청자 찾기" aria-label="신청번호, 제목, 요청자 찾기"></div>
        <!-- list standard L-1: secondary filters live in the [필터] popover (was two loose selects) -->
        <span class="u-rel">
          <button class="btn" id="af-btn" aria-haspopup="dialog" aria-expanded="false" aria-controls="af-pop"><i data-ic=filter></i>필터<span class="fcount" id="af-n" hidden></span></button>
          <div class="menu fpop" id="af-pop" role="dialog" aria-label="결재함 필터">
            <div class="frow"><label class="fl" for="f-type">문서 유형</label><select class="input" id="f-type"><option value="">전체</option><option value="dict">사전 신청</option><option value="model">모델 확정</option></select></div>
            <div class="frow"><label class="fl" for="f-step">단계</label><select class="input" id="f-step"><option value="">전체</option><option value="da">DA 승인</option><option value="final">최종 승인</option><option value="done">완료</option><option value="rejected">반려됨</option><option value="withdrawn">회수됨</option></select></div>
            <div class="ffoot"><button class="btn ghost sm" id="af-reset">필터 초기화</button><span class="grow"></span><button class="btn sm" id="af-done">닫기</button></div>
          </div>
        </span>
        <span class="grow"></span><span class="caption muted" id="boxhint" hidden></span>
      </div>
      <div class="listhead" id="alh"></div>
      <div class="scroll" style="padding:16px 20px" id="listwrap">
        <table class="tbl">
          <thead><tr><th>신청번호</th><th>유형</th><th>제목</th><th>요청자</th><th>현재 단계</th><th class="r">머문 일</th><th class="r">건수</th><th>신청일</th></tr></thead>
          <tbody id="rows"></tbody>
        </table>
      </div>
      <!-- DX-21 신청·결재 집계 (사전 신청) -->
      <div class="scroll" id="stats" hidden></div>
    </div>
    <aside class="rpanel" id="pn-doc" data-tabscope aria-label="결재 문서"></aside>
  </div>

  <!-- MO-22 self approval -->
  <div class="overlay" id="mo-self" role="dialog" aria-modal="true" aria-labelledby="self-t"><div class="modal">
    <div class="m-head"><h3 id="self-t">자기 승인</h3></div>
    <div class="m-body">
      <div class="banner u-mb-12"><span class="sg-ic" data-ic="info"></span><div>본인이 신청한 문서를 <b id="self-step">DA</b> 단계에서 승인합니다. 사유는 결재 이력과 감사 로그에 <b>‘자기 승인’</b>으로 남습니다.</div></div><label class="flex caption u-mb-8" id="self-ack-w" hidden><input type="checkbox" id="self-ack"> <span id="self-ack-t"></span></label>
      <div class="field"><label for="self-why">자기 승인 사유 *</label><textarea class="input" id="self-why" rows="3"></textarea></div>
    </div>
    <div class="m-foot"><button class="btn" data-close="mo-self">취소</button><button class="btn primary" id="do-self" data-busy data-needs="self-why">사유 남기고 승인</button></div>
  </div></div>
  <!-- MO-24 approve -->
  <div class="overlay" id="mo-apr" role="dialog" aria-modal="true" aria-labelledby="apr-t"><div class="modal">
    <div class="m-head"><h3 id="apr-t">승인</h3></div>
    <div class="m-body"><div id="apr-sum" class="caption u-mb-8"></div>
      <div class="field"><label for="apr-note">승인 의견 <span class="faint">선택 · 이력에 남습니다</span></label><textarea class="input" id="apr-note" rows="2"></textarea></div><label class="flex caption u-mt-8" id="apr-ack-w" hidden><input type="checkbox" id="apr-ack"> <span id="apr-ack-t"></span></label></div>
    <div class="m-foot"><button class="btn" data-close="mo-apr">취소</button><button class="btn primary" id="do-apr" data-busy>승인</button></div>
  </div></div>
  <!-- MO-23 reject -->
  <div class="overlay" id="mo-reject" role="dialog" aria-modal="true" aria-labelledby="rej-t"><div class="modal">
    <div class="m-head"><h3 id="rej-t">반려</h3></div>
    <div class="m-body"><div class="field"><label for="rej-why">반려 의견 * <span class="faint">신청자에게 앱 알림으로 전달됩니다</span></label><textarea class="input" id="rej-why" rows="3" placeholder="보완할 내용을 적어 주세요"></textarea></div></div>
    <div class="m-foot"><button class="btn" data-close="mo-reject">취소</button><button class="btn danger" id="do-rej" data-busy data-needs="rej-why" data-needs-msg="반려 의견을 입력해야 합니다">반려</button></div>
  </div></div>
  <!-- MO-25 withdraw -->
  <div class="overlay" id="mo-wd" role="dialog" aria-modal="true" aria-labelledby="wd-t"><div class="modal">
    <div class="m-head"><h3 id="wd-t">회수</h3></div>
    <div class="m-body"><div class="caption muted u-mb-8">회수하면 결재가 취소되고, 모델 확정이면 업무 영역 잠금이 풀려 다시 편집할 수 있습니다.</div>
      <div class="field"><label for="wd-why">회수 사유 *</label><textarea class="input" id="wd-why" rows="2"></textarea></div></div>
    <div class="m-foot"><button class="btn" data-close="mo-wd">취소</button><button class="btn" id="do-wd" data-needs="wd-why">회수</button></div>
  </div></div>
  <!-- MO-26 diff -->
  <div class="overlay" id="mo-diff" role="dialog" aria-modal="true" aria-labelledby="diff-t"><div class="modal">
    <div class="m-head"><div class="flex"><h3 id="diff-t">직전 확정본 대비 변경</h3><span class="grow"></span><button class="iconbtn u-w-28 u-h-28 u-r-md" data-close="mo-diff" aria-label="닫기"><span class="sg-ic" data-ic="x"></span></button></div></div>
    <div class="m-body" style="max-height:60vh;overflow:auto" id="diff-body"></div>
    <div class="m-foot"><a class="btn" id="diff-erd" href="model.html">ERD로 보기</a><button class="btn primary" data-close="mo-diff">닫기</button></div>
  </div></div>
</div>
</div>
<script>
window.pageInit = function () {
  const $ = id => document.getElementById(id);
  document.querySelectorAll('.sg-ic').forEach(s => { s.outerHTML = icon(s.dataset.ic); });
  const q = new URLSearchParams(location.search);
  let docs = getDocs();
  const nameOf = id => USERS[id] ? USERS[id].name : id;
  // review mode (&audit=1&as=) keeps its role when a toast button or undo moves to another screen (app.js only rewrites <a> clicks)
  const go = h => { location.href = h + (q.has('audit') && q.get('as') && !/[?&]as=/.test(h) ? (h.includes('?') ? '&' : '?') + 'audit=1&as=' + q.get('as') : ''); };
  const inQueue = d => canActOn(d);   // role for the step + (model documents) the system in charge — RBAC (15)
  const BOX = {
    queue: ['대기함', d => inQueue(d)],
    mine: ['내 신청', d => d.req === ME.id],
    cc: ['참조함', d => (d.cc || []).includes(ME.id)],
    all: ['전체', d => canSeeDoc(d)]
  };
  // DX-21: the stats view is for the people who oversee approvals (DA · 기관 담당자 · Admin)
  const canStats = can('appr.viewall') || can('settings');
  // DX-11: anyone who can read the dictionary may open an in-progress dictionary request read-only (model documents keep their rule)
  const roView = d => !!d && !canSeeDoc(d) && d.type === 'dict' && inReview(d) && can('dict.view');
  const canView = d => canSeeDoc(d) || roView(d);
  const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
  // 'M/D HH:mm' (seed · nowStr) or 'YYYY-MM-DD HH:mm' (submittedAt) → ms. a M/D date in the future means last year
  const parseAt = s => { const t = String(s || '').trim(); let m = t.match(/^(\d{4})-(\d{1,2})-(\d{1,2})(?:\s+(\d{1,2}):(\d{2}))?/);
    if (m) return new Date(+m[1], +m[2] - 1, +m[3], +(m[4] || 0), +(m[5] || 0)).getTime();
    m = t.match(/^(\d{1,2})\/(\d{1,2})(?:\s+(\d{1,2}):(\d{2}))?/);
    if (m) { const n = new Date(); const x = new Date(n.getFullYear(), +m[1] - 1, +m[2], +(m[3] || 0), +(m[4] || 0)); if (x.getTime() > n.getTime() + 864e5) x.setFullYear(n.getFullYear() - 1); return x.getTime(); }
    return NaN; };
  let box = q.get('box') || (ME.has('da') || ME.has('owner') ? 'queue' : 'mine');
  if (box === 'queue' && !(ME.has('da') || ME.has('owner'))) box = 'mine';
  if (box === 'stats' && !canStats) box = 'mine';
  if (!BOX[box] && box !== 'stats') box = 'mine';
  let sel = null;
  // the box a deep-linked document belongs to; someone else's request opened read-only stays in the current list (DX-11)
  const boxFor = d => { if (BOX[box] && BOX[box][1](d)) return box; return BOX.queue[1](d) ? 'queue' : BOX.mine[1](d) ? 'mine' : BOX.cc[1](d) ? 'cc' : canSeeDoc(d) ? 'all' : (BOX[box] ? box : 'mine'); };
  const stepRole = s => s === 'da' ? 'DA' : s === 'final' ? '기관 담당자' : '';
  const stBadge = d => docTag(d);
  const ageCell = d => ['da', 'final'].includes(d.step) ? (docLate(d) ? `<span class="num u-danger">${icon('err', 12)} ${docAge(d)}일<span class="sr-only"> 기한 넘김</span></span>` : `<span class="num">${docAge(d)}일</span>`) : '<span class="faint">—</span>';

  function drawBoxes() {
    $('boxes').innerHTML = Object.entries(BOX).filter(([k]) => k !== 'all' && (k !== 'queue' || ME.has('da') || ME.has('owner'))).map(([k, [l, f]]) => `<button type="button" aria-pressed="${box === k}" class="${box === k ? 'on' : ''}" data-box="${k}">${l} <span class="n">${docs.filter(f).length}</span></button>`).join('')
      + (canStats ? `<button type="button" aria-pressed="${box === 'stats'}" class="${box === 'stats' ? 'on' : ''}" data-box="stats">${icon('table', 12)} 집계</button>` : '');
    $('boxhint').textContent = box === 'queue' ? (ME.has('da') || ME.has('owner') ? `지금 내 역할(${ME.roles.filter(r => r === 'da' || r === 'owner').map(r => ROLE_NAME[r]).join('·')}) 차례인 문서만` : '결재 역할이 없습니다') : box === 'mine' ? '내가 신청한 문서 · 회수·보완' : box === 'all' ? '볼 수 있는 전체 문서 — 대기함 · 내 신청 · 참조함에 없는 문서도 함께 보입니다' : '참조로 지정된 문서 · 조회 전용';
    $('boxhint').hidden = box !== 'all';   // the 'all' list has no box button — say what is listed
  }
  function list() {
    if (!BOX[box]) return [];   // the stats view has no document list
    const ft = $('f-type').value, fs = $('f-step').value, fq = $('f-q').value.trim();
    // L-2 '문서 · 코드' profile: field by field, case-insensitive ('12' finds REQ-2026-0012; no match across field boundaries)
    return docs.filter(BOX[box][1]).filter(d => (!ft || d.type === ft) && (!fs || d.step === fs) && listMatch(fq, [d.id, d.title, nameOf(d.req)], 'doc')).map((d, i) => [d, i]).sort((a, b) => ((inQueue(b[0]) ? 1 : 0) - (inQueue(a[0]) ? 1 : 0)) || ((['da', 'final'].includes(b[0].step) ? docAge(b[0]) : -1) - (['da', 'final'].includes(a[0].step) ? docAge(a[0]) : -1)) || a[1] - b[1]).map(x => x[0]);
  }
  function drawRows() {
    const st = box === 'stats';
    $('tb').hidden = st; $('listwrap').hidden = st; $('stats').hidden = !st;
    if (st) { drawStats(); return; }
    const L = list();
    // L-5 count line: total in the box → after filters, the default order, applied filter chips + 모두 지우기
    const tot = docs.filter(BOX[box][1]).length, ft = $('f-type'), fs = $('f-step'), fq = $('f-q').value.trim();
    const act = [fq && ['q', '검색: ' + esc(fq)], ft.value && ['f-type', '유형: ' + ft.options[ft.selectedIndex].text], fs.value && ['f-step', '단계: ' + fs.options[fs.selectedIndex].text]].filter(Boolean);
    $('af-n').hidden = !(ft.value || fs.value); $('af-n').textContent = (ft.value ? 1 : 0) + (fs.value ? 1 : 0);
    $('alh').innerHTML = `<b class="u-fg">${act.length ? `${tot}건 중 ${L.length}건` : `${L.length}건`}</b> · 내 차례 우선 · 오래 머문 순${act.length ? ` <span class="fchips">${act.map(([k, l]) => `<button class="fchip" data-aclr="${k}" aria-label="${l} 필터 지우기">${l}<i data-ic=x data-s=12></i></button>`).join('')}<button class="btn ghost sm" data-aclr="all">모두 지우기</button></span>` : ''}`;
    liveCount(`${L.length}건`);
    syncUrl();
    $('rows').innerHTML = L.length ? L.map(d => `<tr aria-selected="${sel === d.id}" class="click ${sel === d.id ? 'sel' : ''} ${['done', 'withdrawn', 'rejected'].includes(d.step) ? 'dim' : ''}" data-id="${d.id}" tabindex="0"><td class="mono">${d.id}</td><td class="muted">${d.type === 'model' ? '모델 확정' : '사전 신청'}</td><td>${d.title}</td><td>${nameOf(d.req)}${d.req === ME.id ? ' <span class="muted">(나)</span>' : ''}</td><td>${box === 'queue' ? docTag(d) : stBadge(d)}</td><td class="r">${ageCell(d)}</td><td class="num">${d.n}</td><td class="num muted">${d.date}</td></tr>`).join('')

        toast(`최종 승인. 사전에 ${res.applied}건 반영${d.sample ? `(목업 시드: ${d.n}건 중 대표 행만)` : ''}${res.failed.length ? ` · 실패 ${res.failed.length}건` : ''}${backTxt} · 항목 버전이 올라갔습니다(제정차수는 DA 공표 때만)`, res.failed.length ? 'danger' : 'success', d.batch ? { label: '반영본 내려받기', fn: () => toast(`반영본_${d.batch}.xlsx. 새 버전·ID가 들어간 편집용 엑셀`, 'info') } : null);
      }
    } else if (kind === 'reject') {
      if (box === 'queue') captureToast();
      dropMarks(d); editRej = null;   // a whole-document rejection replaces any per-item marks
      addHist(d, { act: '반려', why, step: d.step }); d.step = 'rejected'; saveDocs(docs);
      const rel = releaseDoc(d);   // pending markers of this document are released → the requester can re-request (CL9-07)
      // review: a whole rejection returns the items to the requester's basket exactly like a partial one (excel batches keep their own resume path)
      const backAll = d.type === 'dict' && !d.batch && (d.items || []).length ? returnRejected(d, d.items.map(it => Object.assign({}, it, { rejWhy: `문서 반려 — ${why}` }))) : 0;
      if (d.req !== ME.id || !backAll) notifyReq(`${d.id} 반려됨. 보완 필요`, why);
      toast(`반려했습니다. 신청자에게 의견과 함께 알렸습니다${backAll ? ` · 항목 ${backAll}건을 신청자 바구니로 돌려보냄` : ''}${rel ? ` · 사전 항목 ${rel}건의 '진행 중'을 풀었습니다` : ''}`, 'info');
    } else if (kind === 'withdraw') {
      addHist(d, { act: '회수', why }); d.step = 'withdrawn'; saveDocs(docs);
      const rel = releaseDoc(d);
      toast(d.type === 'model' ? '회수했습니다. 업무 영역 잠금이 풀려 다시 편집할 수 있습니다' : `회수했습니다${rel ? ` · 사전 항목 ${rel}건의 '진행 중'을 풀었습니다` : ''}`, 'info', d.type === 'model' ? { label: '모델 열기', fn: () => go(`model.html?area=${d.area}`) } : { label: '보완해서 다시 신청', fn: () => go(d.batch ? `excel-import.html?resume=${d.batch}` : d.kind === 'std' ? `standardize.html?area=${d.area || 'rq'}&redo=${d.id}` : `dictionary.html?redo=${d.id}`) });
    }
    // decided from the queue → the next document opens; undo restores the state before the decision
    if ((kind === 'approve' || kind === 'reject') && box === 'queue') {
      releaseToast();
      const next = list()[0]; const did = d.id; const left = docs.filter(BOX.queue[1]).length;
      sel = next ? next.id : null;
      const tail = next ? `다음 문서(${next.id})를 열었습니다` : left ? `필터에 맞는 대기 문서가 없습니다 · 남은 대기 ${left}건` : '대기함을 모두 처리했습니다';
      const tok = ++undoTok; const after = snapStore();
      toast(`${captured ? captured[0].replace(/[.。]?$/, '') : did + ' 처리'} · ${tail}`, captured && captured[1] === 'danger' ? 'danger' : 'info', { label: '되돌리기', fn: undoFn(before, after, tok, did) });
      captured = null;
    }
    pending = null; drawBoxes(); drawRows(); panel();
    const row = $('rows').querySelector(`tr[data-id="${sel}"]`); if (row) row.focus(); else { const pb = document.querySelector('#pn-doc .rp-head h2'); if (pb) { pb.tabIndex = -1; pb.focus(); } }   // focus returns after the dialog
  }
  $('do-self').onclick = () => { $('mo-self').classList.remove('open'); act('approve', $('self-why').value.trim(), true); };
  $('do-apr').onclick = () => { $('mo-apr').classList.remove('open'); act('approve', $('apr-note').value.trim(), false); };
  $('do-rej').onclick = () => { $('mo-reject').classList.remove('open'); act('reject', $('rej-why').value.trim()); $('rej-why').value = ''; };
  $('do-wd').onclick = () => { $('mo-wd').classList.remove('open'); act('withdraw', $('wd-why').value.trim()); $('wd-why').value = ''; };
  // L-3: box switches are history steps (push), everything else rewrites the current entry (replace); old doc= links keep working
  const DEF_BOX = ME.has('da') || ME.has('owner') ? 'queue' : 'mine';
  function syncUrl(push) { urlSync(['box', 'q', 'type', 'step', 'sel', 'doc', 'new', 'dup'], { box: box === DEF_BOX ? '' : box, q: $('f-q').value.trim(), type: $('f-type').value, step: $('f-step').value, sel: box === 'stats' ? '' : (sel || '') }, push); }
  window.addEventListener('popstate', () => { const p = new URLSearchParams(location.search); box = p.get('box') || DEF_BOX; if (!BOX[box] && box !== 'stats') box = DEF_BOX; $('f-q').value = p.get('q') || ''; $('f-type').value = p.get('type') || ''; $('f-step').value = p.get('step') || ''; sel = p.get('sel') || (box === 'queue' ? (list()[0] || {}).id : null) || null; drawBoxes(); drawRows(); panel(); });
  $('boxes').addEventListener('click', e => { const b = e.target.closest('[data-box]'); if (!b) return; box = b.dataset.box;
    // L-9: only the work queue auto-selects its first document; 내 신청 · 참조함 are lookup lists (panel opens on pick)
    sel = box === 'queue' ? (list()[0] || {}).id || null : null; syncUrl(true); drawBoxes(); drawRows(); panel(); const nb = $('boxes').querySelector(`[data-box="${box}"]`); if (nb) nb.focus(); });
  // [필터] popover + applied chips
  const afPop = $('af-pop'), afBtn = $('af-btn');
  const setAf = on => { afPop.classList.toggle('open', on); afBtn.setAttribute('aria-expanded', on); if (on) { const f = afPop.querySelector('select'); f && f.focus(); } };
  afBtn.onclick = () => setAf(!afPop.classList.contains('open'));
  $('af-done').onclick = () => { setAf(false); afBtn.focus(); };
  $('af-reset').onclick = () => { $('f-type').value = ''; $('f-step').value = ''; drawRows(); };
  document.addEventListener('click', e => { if (!e.target.closest('#af-pop, #af-btn')) setAf(false); });
  document.addEventListener('keydown', e => { if (e.key === 'Escape' && afPop.classList.contains('open')) { setAf(false); afBtn.focus(); } }, true);
  document.addEventListener('click', e => { const c = e.target.closest('[data-aclr]'); if (!c) return; const k = c.dataset.aclr;
    if (k === 'all' || k === 'q') $('f-q').value = ''; if (k === 'all' || k === 'f-type') $('f-type').value = ''; if (k === 'all' || k === 'f-step') $('f-step').value = '';
    if (box === 'queue' && !list().some(d => d.id === sel)) sel = (list()[0] || {}).id || null; drawRows(); panel(); const nc = document.querySelector('#alh [data-aclr]'); (nc || $('f-q')).focus(); });
  $('f-q').addEventListener('keydown', e => { if (e.key === 'Escape' && $('f-q').value) { e.stopPropagation(); $('f-q').value = ''; drawRows(); } });
  $('rows').addEventListener('click', e => { const r = e.target.closest('tr[data-id]'); if (!r) return; sel = r.dataset.id; drawRows(); panel(); });
  document.addEventListener('keydown', e => {
    if (e.ctrlKey || e.metaKey || e.altKey || e.isComposing || dbmStore.get('dbm-single-keys', '1') !== '1' || e.target.closest('input, textarea, select, [contenteditable]') || document.querySelector('.overlay.open, .gs-overlay.open')) return;
    if (!(document.activeElement === document.body || e.target.closest('#rows, #pn-doc, .main'))) return;
    const k = e.key.toLowerCase(); const L = list(); const i = L.findIndex(x => x.id === sel);
    if (k === 'j' || k === 'k') { const n = L[Math.max(0, Math.min(L.length - 1, (i < 0 ? -1 : i) + (k === 'j' ? 1 : -1)))]; if (n) { e.preventDefault(); sel = n.id; drawRows(); panel(); const r = $('rows').querySelector(`tr[data-id="${sel}"]`); if (r) r.focus(); } }
    else if (k === 'a') { const b = $('btn-apr'); if (b && !b.disabled) { e.preventDefault(); b.click(); } }
    else if (k === 'r') { const b = document.querySelector('#pn-doc [data-open="mo-reject"]'); if (b) { e.preventDefault(); b.click(); } }
  });
  $('rows').addEventListener('keydown', e => {
    const r = e.target.closest('tr[data-id]'); if (!r) return;
    if (e.key === 'Enter') { e.preventDefault(); e.stopPropagation(); sel = r.dataset.id; drawRows(); panel(); const n = $('rows').querySelector(`tr[data-id="${sel}"]`); if (n) n.focus(); }   // keep focus (CL4-01)
    if (e.key === 'ArrowDown' && r.nextElementSibling) { e.preventDefault(); r.nextElementSibling.focus(); }
    if (e.key === 'ArrowUp' && r.previousElementSibling) { e.preventDefault(); r.previousElementSibling.focus(); }
  });
  ['f-type', 'f-step'].forEach(id => $(id).onchange = drawRows); $('f-q').oninput = drawRows;

  // ?new=1&doc=ID. the source screen already created the document (createDoc); we only show it
  // the success banner only for a real, visible, still-open request of mine. not for any URL with new=1 (CX11-03 · CL11-03)
  const nd = q.get('new') && q.get('doc') ? docs.find(x => x.id === q.get('doc')) : null;
  if (q.get('new') && q.get('doc') && !(nd && canSeeDoc(nd) && nd.req === ME.id && ['da', 'final'].includes(nd.step))) {
    $('new-banner').hidden = false;
    $('new-banner').innerHTML = `<div class="banner ${nd ? '' : 'danger'}">${icon(nd ? 'info' : 'err')}<div class="grow">${nd && canSeeDoc(nd) ? `<b>${nd.id}</b>는 지금 ${STEP_NAME[nd.step]} 상태입니다. 새 신청 결과 화면이 아닙니다.` : `<b>${q.get('doc')}</b> 신청을 찾을 수 없거나 볼 수 없습니다. 신청이 만들어지지 않았을 수 있습니다. 내 신청에서 확인하세요.`}</div></div>`;
  } else if (q.get('new') && q.get('doc')) {
    const id = q.get('doc'), d = nd;
    $('new-banner').hidden = false;
    $('new-banner').innerHTML = `<div class="banner">${icon('check')}<div class="grow"><b>${id} ${q.get('dup') ? '이미 신청돼 있습니다' : '신청됨'}</b>. ${d ? d.title : ''}. ${q.get('dup') ? '같은 내용의 진행 중 신청이 있어 새로 만들지 않았습니다.' : d && canActOn(d) ? '1단계를 내가 처리할 수 있어 바로 대기함에 들어왔습니다. 직접 승인하면 ‘자기 승인’으로 남습니다.' : `1단계 담당 ${d ? approversFor(d, 'da').length : 0}명에게 알렸습니다.`}</div></div>`;
    box = d && canActOn(d) ? 'queue' : 'mine';
  }
  $('f-q').value = q.get('q') || ''; $('f-type').value = q.get('type') || ''; $('f-step').value = q.get('step') || '';
  const dl = q.get('doc') || q.get('sel');   // doc= is the old deep-link key — kept as an alias of sel=
  if (dl) { sel = dl; const d = docs.find(x => x.id === sel); if (d) box = boxFor(d); }
  if (!sel && box === 'queue') sel = (list()[0] || {}).id || null;   // L-9: auto-select only in the work queue
  drawBoxes(); drawRows(); panel();
};
</script>
</body>
</html>
