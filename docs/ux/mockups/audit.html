<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>감사 로그 · DBModeler 목업</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="assets/app.css">
<script src="assets/app.js"></script>
</head>
<body data-page="audit">
<div id="app">
<div id="content" class="page">
  <div class="page-header">
    <h1>감사 로그</h1><span class="badge" title="수정·삭제 불가 · 5년 보관">보존 5년</span>
    <div class="actions"><button class="btn" id="axl">엑셀</button></div>
  </div>
  <div class="toolbar">
    <span class="chip on" data-group="ak" data-filter="">전체</span>
    <span class="chip" data-group="ak" data-filter="appr">결재</span>
    <span class="chip" data-group="ak" data-filter="self">자기 승인</span>
    <span class="chip" data-group="ak" data-filter="role">역할·권한</span>
    <span class="chip" data-group="ak" data-filter="set">설정</span>
    <span class="chip" data-group="ak" data-filter="dict">사전 반영</span>
    <span class="chip" data-group="ak" data-filter="model">모델 확정</span>
    <span class="chip" data-group="ak" data-filter="purge">영구 삭제</span>
    <span class="grow"></span>
    <select class="input" id="aper" style="width:140px;" aria-label="기간"><option value="30">최근 30일</option><option value="365">최근 1년</option><option value="0" selected>전체</option></select>
    <input class="input" id="aq" style="width:200px;" placeholder="사용자·문서 번호" aria-label="사용자·문서 번호 검색">
  </div>
  <div class="listhead" id="alh"></div>
  <div class="scroll">
    <table class="tbl"><thead><tr><th>일시</th><th>사용자</th><th>종류</th><th>대상</th><th>내용 (전 → 후)</th><th>사유</th><th>IP</th></tr></thead><tbody id="ab"></tbody></table>
  </div>
</div>
</div>
<script>
window.pageInit = function () {
  if (!ME.has('da') && !ME.has('admin')) { location.replace('error.html?code=403&need=DA 또는 Admin&what=감사 로그'); return; }
  // single source (CX13-14): approval history of every document + dictionary publications + settings/role/candidate audit entries + permanent deletions.
  // nothing is typed into the page; every row comes from the shared state, sorted by time
  const key = at => { at = String(at || ''); if (/^\d\d\/\d\d/.test(at)) return '2026-' + at.slice(0, 2) + '-' + at.slice(3); return at.replace('T', ' ').slice(0, 16); };
  const docLink = id => /^REQ-/.test(id) ? `<a class="mono" href="approvals.html?doc=${id}">${id}</a>` : `<span class="mono">${id}</span>`;
  const rows = [];
  const FIXED = [];   // only events that happened in this state (CX14-12)
  getDocs().forEach(d => (d.hist || []).forEach(h => rows.push({ at: key(h.at), who: h.who, f: 'appr' + (h.self ? ' self' : '') + (d.type === 'model' && (h.step === 'final' || /확정/.test(h.act)) ? ' model' : '') + (d.type === 'dict' && /승인/.test(h.act) && d.step === 'done' && h === d.hist[d.hist.length - 1] ? ' dict' : ''),
    kind: h.self ? '<span class="badge b-violet">자기 승인</span>' : /반려/.test(h.act) ? `<span class="badge b-danger">${h.act}</span>` : `<span class="badge">${h.act}</span>`, tgt: docLink(d.id), what: d.title + (d.step === 'done' && h === d.hist[d.hist.length - 1] ? (d.type === 'model' ? ' · <b>확정본</b>' : ' · <b>사전 반영</b>') : ''), why: h.why || '' })));
  getChanges().filter(c => c.act === '공표').forEach(c => rows.push({ at: key(c.at), who: c.by, f: 'dict', kind: '<span class="badge b-violet">공표</span>', tgt: `<a href="dict-history.html#pub">${c.item}</a>`, what: '기관 사전 제정차수 +1', why: c.diff || '' }));
  const F2 = a => /역할/.test(a) ? 'role' : /설정|검수 기준/.test(a) ? 'set' : /후보/.test(a) ? 'dict' : 'set';
  getAudit().filter(a => a.act !== '영구 삭제').forEach(a => rows.push({ at: key(a.at), who: a.who, f: F2(a.act), kind: `<span class="badge ${/역할/.test(a.act) ? 'b-warning' : ''}">${a.act}</span>`, tgt: a.target || '', what: a.what || a.why || '', why: a.what ? (a.why || '') : '' }));
  JSON.parse(dbmStore.get('dbm-purge', '[]')).forEach(p => rows.push({ at: key(p.at), who: p.who, f: 'purge', kind: '<span class="badge b-danger">영구 삭제</span>', tgt: `<span class="mono">${p.id}</span> ${p.name}`, what: `${p.kind || ''} 항목 영구 삭제 · 근거 ${p.doc !== '—' ? docLink(p.doc) : '—'}`, why: p.why || '' }));
  rows.push(...FIXED); rows.sort((a, b) => b.at.localeCompare(a.at));
  const ab = document.getElementById('ab');
  ab.innerHTML = rows.map(r => `<tr data-f="${r.f}" data-at="${r.at}"><td class="mono">${r.at}</td><td>${r.who}</td><td>${r.kind}</td><td>${r.tgt}</td><td>${r.what}</td><td class="caption">${r.why}</td><td class="mono">${r.ip || '—'}</td></tr>`).join('') || '<tr class="er none"><td colspan="7" class="caption muted" style="text-align:center;padding:24px">기록이 없습니다</td></tr>';
  // chip + period + text search in one pass
  const aq = document.getElementById('aq'), per = document.getElementById('aper'); let kind = '';
  const since = () => { const n = +per.value; if (!n) return ''; const d = new Date(Date.now() - n * 864e5); return d.toISOString().slice(0, 10); };
  let shown = 0;
  const apply = () => { const v = aq.value.trim(), lo = since(); shown = 0; [...ab.rows].forEach(r => { if (!r.dataset.at) return; const ok = (!kind || (r.dataset.f || '').split(' ').includes(kind)) && (!v || r.innerText.includes(v)) && (!lo || r.dataset.at >= lo); r.style.display = ok ? '' : 'none'; if (ok) shown++; });
    document.getElementById('alh').innerHTML = `<b style="color:var(--fg)">${shown}건</b>${kind || v || lo ? ' · 필터 적용' : ''} · 결재 이력·공표·설정·역할·영구 삭제를 한 곳에서 시간순으로`; };
  aq.oninput = apply; per.onchange = apply;
  document.querySelector('.toolbar').addEventListener('click', e => { const c = e.target.closest('.chip[data-filter]'); if (!c) return; kind = c.dataset.filter; setTimeout(apply, 0); });
  document.getElementById('axl').onclick = () => toast(`감사 로그 ${shown}건을 엑셀로 내려받았습니다(현재 필터 기준)`, 'info');
  apply();
};
</script>
</body>
</html>
