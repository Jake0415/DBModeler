<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>감사 로그 · NeoDB 목업</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="assets/app.css">
<script src="assets/app.js"></script>
<style>
  /* long 내용 · 사유 wrap instead of pushing the table past the window (1600 frame) */
  #ab td:nth-child(5), #ab td:nth-child(6) { white-space:normal; min-width:200px; }
  #ab td:nth-child(4) { white-space:normal; }
</style>
</head>
<body data-page="audit">
<div id="app">
<div id="content" class="page">
  <div class="page-header">
    <h1>감사 로그</h1><span class="badge" title="수정·삭제 불가 · 5년 보관">보존 5년</span>
    <div class="actions"><button class="btn" id="axl">엑셀</button></div>
  </div>
  <!-- list standard: search → quick chips (6 + more) → the screen's main filter (period, default 30 days) -->
  <div class="toolbar">
    <div class="search" style="flex-basis:260px"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><input class="input" id="aq" placeholder="사용자 · 대상 · 내용 · 사유 찾기" aria-label="사용자, 대상, 내용, 사유 찾기"></div>
    <span class="flex u-gap-8" role="group" aria-label="종류" id="ak">
      <button class="chip on" data-k="">전체</button><button class="chip" data-k="self">자기 승인</button><button class="chip" data-k="purge">영구 삭제</button><button class="chip" data-k="appr">결재</button><button class="chip" data-k="role">역할·권한</button><button class="chip" data-k="set">설정</button>
    </span>
    <select class="input" id="amore" style="width:120px;" aria-label="종류 더보기"><option value="">더보기…</option><option value="dict">사전 반영</option><option value="model">모델 확정</option></select>
    <span class="grow"></span>
    <select class="input" id="aper" style="width:140px;" aria-label="기간"><option value="30" selected>최근 30일</option><option value="365">최근 1년</option><option value="0">전체 기간</option></select>
  </div>
  <div class="listhead" id="alh"></div>
  <div class="scroll">
    <table class="tbl"><thead><tr><th>일시</th><th>사용자</th><th>종류</th><th>대상</th><th>내용 (전 → 후)</th><th>사유</th><th>IP</th></tr></thead><tbody id="ab"></tbody></table>
  </div>
</div>
</div>
<script>
window.pageInit = function () {
  // review mode (&audit=1&as=) carries its role into the 403 page, so it reports the reviewed role, not the saved one
  const auQ = (() => { const s = new URLSearchParams(location.search); return s.has('audit') && s.get('as') ? '&audit=1&as=' + s.get('as') : ''; })();
  if (!can('audit.view')) { location.replace('error.html?code=403&need=DA 또는 Admin&what=감사 로그' + auQ); return; }
  // single source (CX13-14): approval history of every document + dictionary publications + settings/role/candidate audit entries + permanent deletions.
  // nothing is typed into the page; every row comes from the shared state, sorted by time
  const key = at => { at = String(at || ''); if (/^\d\d\/\d\d/.test(at)) return '2026-' + at.slice(0, 2) + '-' + at.slice(3); return at.replace('T', ' ').slice(0, 16); };
  const docLink = id => /^REQ-/.test(id) ? `<a class="mono" href="approvals.html?doc=${id}">${id}</a>` : `<span class="mono">${id}</span>`;
  const rows = [];
  const FIXED = [];   // only events that happened in this state (CX14-12)
  getDocs().forEach(d => (d.hist || []).forEach(h => rows.push({ at: key(h.at), who: h.who, f: 'appr' + (h.self ? ' self' : '') + (d.type === 'model' && (h.step === 'final' || /확정/.test(h.act)) ? ' model' : '') + (d.type === 'dict' && /승인/.test(h.act) && d.step === 'done' && h === d.hist[d.hist.length - 1] ? ' dict' : ''),
    kind: h.self ? '<span class="badge b-violet">자기 승인</span>' : /반려/.test(h.act) ? `<span class="badge b-danger">${h.act}</span>` : `<span class="badge">${h.act}</span>`, tgt: docLink(d.id), what: d.title + (d.step === 'done' && h === d.hist[d.hist.length - 1] ? (d.type === 'model' ? ' · <b>확정본</b>' : ' · <b>사전 반영</b>') : ''), why: h.why || '' })));
  // a publication row opens the change history with that edition highlighted (E9)
  // the current edition (getPub) is a publication too, even when the seed has no change-history row for it
  { const P = getPub(); if (P && P.cha && !getChanges().some(c => c.act === '공표' && +(c.pub || (String(c.item).match(/(\d+)차/) || [])[1]) === +P.cha)) rows.push({ at: key(P.at), who: P.by, f: 'dict', kind: '<span class="badge b-violet">공표</span>', tgt: `<a href="dict-history.html?pub=${P.cha}#pub-${P.cha}" title="변경 내역에서 제정 ${P.cha}차 보기">제정 ${P.cha}차 공표</a>`, what: '기관 사전 제정차수 +1', why: P.why || '' }); }
  getChanges().filter(c => c.act === '공표').forEach(c => { const n = c.pub || (String(c.item).match(/(\d+)차/) || [])[1]; rows.push({ at: key(c.at), who: c.by, f: 'dict', kind: '<span class="badge b-violet">공표</span>', tgt: n ? `<a href="dict-history.html?pub=${n}#pub-${n}" title="변경 내역에서 제정 ${n}차 보기">${c.item}</a>` : `<a href="dict-history.html">${c.item}</a>`, what: '기관 사전 제정차수 +1', why: c.diff || '' }); });
  // account changes (등록 · 중지 · 삭제 · 인증 방식) belong to 역할·권한
  const F2 = a => /역할|계정|사용자|인증|비밀번호|잠금/.test(a) ? 'role' : /설정|검수 기준/.test(a) ? 'set' : /후보/.test(a) ? 'dict' : 'set';
  getAudit().filter(a => a.act !== '영구 삭제').forEach(a => rows.push({ at: key(a.at), who: a.who, f: F2(a.act), kind: `<span class="badge ${/역할/.test(a.act) ? 'b-warning' : ''}">${a.act}</span>`, tgt: a.target || '', what: a.what || a.why || '', why: a.what ? (a.why || '') : '' }));
  JSON.parse(dbmStore.get('dbm-purge', '[]')).forEach(p => rows.push({ at: key(p.at), who: p.who, f: 'purge', kind: '<span class="badge b-danger">영구 삭제</span>', tgt: `<span class="mono">${p.id}</span> ${p.name}`, what: `${p.kind || ''} 항목 영구 삭제 · 근거 ${p.doc !== '—' ? docLink(p.doc) : '—'}`, why: p.why || '' }));
  rows.push(...FIXED); rows.sort((a, b) => b.at.localeCompare(a.at));
  const ab = document.getElementById('ab');
  // list standard: the list is re-drawn from data (not hidden rows) — count, empty state and export all read one result
  const strip = h => { const d = document.createElement('div'); d.innerHTML = h || ''; return d.textContent; };
  rows.forEach(r => { r.txt = [r.who, strip(r.kind), strip(r.tgt), strip(r.what), strip(r.why)]; });
  const KN = { self: '자기 승인', purge: '영구 삭제', appr: '결재', role: '역할·권한', set: '설정', dict: '사전 반영', model: '모델 확정' };
  const PN = { 30: '최근 30일', 365: '최근 1년', 0: '전체 기간' };
  const aq = document.getElementById('aq'), per = document.getElementById('aper'), more = document.getElementById('amore');
  const q0 = new URLSearchParams(location.search);
  let kind = KN[q0.get('f')] ? q0.get('f') : ''; aq.value = q0.get('q') || ''; if (['30', '365', '0'].includes(q0.get('per'))) per.value = q0.get('per');
  const TODAY = new Date(window.MOCK_TODAY || Date.now());
  const since = () => { const n = +per.value; if (!n) return ''; const d = new Date(TODAY.getTime() - n * 864e5); return d.toISOString().slice(0, 10); };
  const syncChips = () => { document.querySelectorAll('#ak .chip').forEach(c => c.classList.toggle('on', c.dataset.k === kind)); more.value = ['dict', 'model'].includes(kind) ? kind : ''; };
  let L = [];
  const apply = () => {
    const v = aq.value.trim(), lo = since();
    const inPer = rows.filter(r => !lo || r.at >= lo);
    L = inPer.filter(r => (!kind || r.f.split(' ').includes(kind)) && listMatch(v, r.txt, 'log'));
    const filtered = kind || v;
    ab.innerHTML = L.map(r => `<tr data-f="${r.f}" data-at="${r.at}"><td class="mono">${r.at}</td><td>${r.who}</td><td>${r.kind}</td><td>${r.tgt}</td><td>${r.what}</td><td class="caption">${r.why}</td><td class="mono">${r.ip || '—'}</td></tr>`).join('')
      || (!rows.length ? '<tr class="er first"><td colspan="7" class="caption muted u-tc u-p-24"><span class="et">아직 감사 기록이 없습니다</span>결재 · 공표 · 설정 · 역할 변경 · 영구 삭제가 일어나면 시간순으로 쌓입니다.</td></tr>'
        : filtered ? '<tr class="er none"><td colspan="7" class="caption muted u-tc u-p-24"><span class="et">필터에 맞는 기록이 없습니다</span><button class="btn sm ghost" type="button" data-aclr="all">모두 지우기</button></td></tr>'
        : `<tr class="er none"><td colspan="7" class="caption muted u-tc u-p-24"><span class="et">${PN[per.value]} 기록이 없습니다</span>더 오래된 기록 ${rows.length}건이 있습니다. <button class="btn sm ghost" type="button" id="aper-all">전체 기간 보기</button></td></tr>`);
    const act = [v && ['q', '검색: ' + v.replace(/[<>&"]/g, '')], kind && ['f', '종류: ' + KN[kind]]].filter(Boolean);
    document.getElementById('alh').innerHTML = `<b class="u-fg">${filtered ? `${inPer.length}건 중 ${L.length}건` : `${L.length}건`}</b> · ${PN[per.value]} · 최근 순${act.length ? ` <span class="fchips">${act.map(([k, l]) => `<button class="fchip" data-aclr="${k}" aria-label="${l} 필터 지우기">${l}<i data-ic=x data-s=12></i></button>`).join('')}<button class="btn ghost sm" data-aclr="all">모두 지우기</button></span>` : ''} <span class="grow"></span><span class="caption muted">결재 이력 · 공표 · 설정 · 역할 · 영구 삭제를 한 곳에서</span>`;
    document.getElementById('axl').textContent = `엑셀 (${L.length}건)`;
    liveCount(`${L.length}건`);
    urlSync(['q', 'f', 'per'], { q: v, f: kind, per: per.value === '30' ? '' : per.value });
  };
  aq.oninput = apply; per.onchange = apply;
  aq.addEventListener('keydown', e => { if (e.key === 'Escape' && aq.value) { e.stopPropagation(); aq.value = ''; apply(); } });
  document.getElementById('ak').addEventListener('click', e => { const c = e.target.closest('.chip[data-k]'); if (!c) return; kind = c.dataset.k; syncChips(); apply(); });
  more.onchange = () => { kind = more.value; syncChips(); apply(); };
  // 모두 지우기 = back to the default view (search · kind cleared; the period goes back to 30 days)
  document.addEventListener('click', e => { if (e.target.closest('#aper-all')) { per.value = '0'; apply(); return; }
    const c = e.target.closest('[data-aclr]'); if (!c) return; const k = c.dataset.aclr;
    if (k === 'all' || k === 'q') aq.value = ''; if (k === 'all' || k === 'f') kind = ''; if (k === 'all') per.value = '30';
    syncChips(); apply(); const nc = document.querySelector('#alh [data-aclr]'); (nc || aq).focus(); });
  // L-12 export: names the scope and count; the file's first line records the filters
  document.getElementById('axl').onclick = () => toast(`감사 로그 ${L.length}건을 엑셀로 내려받았습니다 — 필터: ${[PN[per.value], kind && '종류 ' + KN[kind], aq.value.trim() && `검색 ‘${aq.value.trim()}’`].filter(Boolean).join(' · ')} (파일 첫 줄에 기록)`, 'info');
  syncChips(); apply();
};
</script>
</body>
</html>
