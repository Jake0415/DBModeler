<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>업로드 이력 · NeoDB 목업</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="assets/app.css">
<script src="assets/app.js"></script>
</head>
<body data-page="excel">
<div id="app">
<div id="content" class="page">
  <div class="page-header">
    
    <h1 title="엑셀 왕복 편집 묶음 · 30일 임시 보관 · 원본 열람은 올린 사람·DA">업로드 이력</h1>
    
    <div class="actions"><a class="btn primary" href="excel-import.html">엑셀 가져오기</a></div>
  </div>
  <div class="toolbar">
    <button class="chip on" data-uf="">전체</button><button class="chip" data-uf="임시 저장">임시 저장</button><button class="chip" data-uf="신청됨">신청됨</button><button class="chip" data-uf="반영됨">반영됨</button><button class="chip" data-uf="보완">반려·회수</button><button class="chip" data-uf="취소">취소</button>
  </div>
  <div class="page-body">
    <div class="main"><div class="scroll">
      <table class="tbl"><thead><tr><th>업로드</th><th>파일</th><th>종류</th><th>올린 사람</th><th>기준본</th><th class="num">행</th><th>결과</th><th>연결 신청</th><th>상태</th></tr></thead><tbody id="ub"></tbody></table>
    </div></div>
    <aside class="rpanel open" id="pn-up" aria-label="업로드 상세"></aside>
  </div>
</div>
</div>
<script>
window.pageInit = function () {
  const $ = id => document.getElementById(id);
  let f = '', sel = new URLSearchParams(location.search).get('b');
  const docs = getDocs();
  const docOf = id => docs.find(d => d.id === id);
  const stateOf = batchState;            // one state function shared with the excel screen (CL10-02)
  const vis = canSeeBatch;
  const expired = b => b.token && ['임시 저장', '보완'].includes(stateOf(b)) && (b.token.policy !== getPolicy().ver || b.token.dict !== dictRev());               // same visibility for the list, the ?b= deep link and file actions (CX9-09)
  function draw() {
    const L = getBatches().filter(vis).filter(b => !f || stateOf(b) === f);
    if (!sel && L[0]) sel = L[0].id;
    $('ub').innerHTML = L.map(b => { const c = b.counts; const st = stateOf(b); const d = (b.docs || []).map(docOf).filter(Boolean);
      return `<tr class="click ${sel === b.id ? 'sel' : ''}" data-b="${b.id}" tabindex="0"><td class="mono">${b.id}<div class="caption faint">${b.at}</div></td><td>${b.file}</td><td>${b.kind}</td><td>${USERS[b.by] ? USERS[b.by].name : b.by}</td><td class="mono caption">${b.baseline}</td><td class="num">${b.rows}</td><td class="caption">${c ? `신규 ${c.new} · 변경 ${c.chg} · 후보 ${c.pick || 0} · 동일 ${c.same} · 보류 ${c.waitDiff + c.pre} · 오류 ${c.err}` : b.note || '—'}</td><td>${d.map(x => `<a class="mono" href="approvals.html?doc=${x.id}">${x.id}</a> <span class="caption">${STEP_NAME[x.step]}</span>`).join('<br>') || '—'}</td><td><span class="badge ${st === '반영됨' ? 'b-success' : st === '보완' ? 'b-danger' : st === '취소' ? '' : 'b-info'}">${st === '보완' ? '반려·회수 — 보완 필요' : st}</span>${expired(b) ? ' <span class="badge b-warning" title="검증 뒤 검수 기준·사전이 바뀜">재검증 필요</span>' : ''}</td></tr>`; }).join('') || '<tr class="er first"><td colspan="9" class="caption muted u-tc u-p-32"><span class="et">아직 업로드가 없습니다</span>사전에서 편집용 엑셀을 내려받아 고친 뒤 올리면 여기에 묶음으로 남습니다.<br><a class="btn primary sm" href="excel-import.html">엑셀 가져오기</a></td></tr>';
    panel();
  }
  function panel() {
    const b = getBatches().find(x => x.id === sel); const p = $('pn-up');
    if (b && !vis(b)) { p.innerHTML = `<div class="rp-head"><h2>${b.id}</h2></div><div class="rp-body"><div class="banner"><i data-ic=info></i><div>다른 사람이 올린 업로드입니다 — 올린 사람과 DA만 볼 수 있습니다.</div></div></div>`; return; }
    if (!b) { p.innerHTML = sel ? `<div class="rp-body"><div class="banner danger"><i data-ic=warn></i><div><b>${sel}</b> 업로드를 찾을 수 없습니다.</div></div></div>` : ''; return; }
    const st = stateOf(b), c = b.counts || {}, s = b.sub;
    const ds = (b.docs || []).map(docOf).filter(Boolean);
    const canResume = b.by === ME.id && ['임시 저장', '보완'].includes(st);
    p.innerHTML = `<div class="rp-head"><div class="t"><span class="mono">${b.id}</span><span class="badge">${b.kind}</span></div><h2 class="u-mt-8">${b.file}</h2><div class="rp-sub">${USERS[b.by] ? USERS[b.by].name : ''} · ${b.at} · 기준본 ${b.baseline}</div></div>
      <div class="rp-body">
        ${b.counts ? `<div class="section-t u-mt-0">검증·비교 결과</div><dl class="kv" style="grid-template-columns:1fr auto">${[['신규', c.new], ['변경', c.chg], ['동일', c.same], ['동일 내용 대기', c.waitSame], ['다른 내용 대기(보류)', c.waitDiff], ['버전 충돌', c.conflict], ['후보 선택', c.pick], ['선행 승인(보류)', c.pre], ['오류', c.err], ['파일에서 빠짐', c.missing]].map(([l, n]) => `<dt>${l}</dt><dd class="num u-tr">${n || 0}</dd>`).join('')}</dl>` : `<div class="banner warning"><i data-ic=warn></i><div>${b.note || '검증 결과 없음'}</div></div>`}
        ${s ? `<div class="section-t">신청한 내용</div><div class="caption">신규 ${s.new} · 변경 ${s.chg + s.conflict} · 후보 ${s.pick} · 미사용 ${s.unuse} — 보류 ${s.hold} · 제외 ${s.ex}</div>` : ''}
        <div class="section-t">연결 신청</div>${ds.map(d => `<div class="flex u-mb-4"><a class="mono" href="approvals.html?doc=${d.id}">${d.id}</a><span class="badge ${d.step === 'done' ? 'b-success' : ['rejected', 'withdrawn'].includes(d.step) ? 'b-danger' : 'b-info'}">${STEP_NAME[d.step]}</span><span class="caption muted">${d.n}건</span></div>`).join('') || '<div class="caption muted">아직 신청하지 않았습니다</div>'}
        ${expired(b) ? '<div class="banner warning u-mt-8"><i data-ic=warn></i><div>검증 뒤 검수 기준 또는 사전이 바뀌었습니다 — [이어서 작업]에서 다시 검증해야 신청할 수 있습니다. 화면에서 고친 값은 유지됩니다.</div></div>' : ''}
        ${st === '보완' ? '<div class="banner warning u-mt-8"><i data-ic=warn></i><div>반려·회수됐습니다. 이어서 보정한 뒤 다시 신청하면 <b>새 신청번호</b>가 만들어지고 이 묶음에 연결됩니다.</div></div>' : ''}
        ${(c.waitDiff || c.pre) && st !== '임시 저장' && !b.holdNext ? `<div class="banner u-mt-8"><i data-ic=info></i><div class="grow">보류 ${(c.waitDiff || 0) + (c.pre || 0)}행 — 앞선 신청이 끝나면 다시 검증해 <b>새 업로드 묶음</b>으로 이어서 신청합니다.</div>${b.by === ME.id ? '<button class="btn sm" id="hold-re">보류 행 다시 검증</button>' : ''}</div>` : ''}
        ${b.holdNext ? `<div class="caption u-mt-8">보류 행은 <a href="uploads.html?b=${b.holdNext}">${b.holdNext}</a>로 이어졌습니다.</div>` : ''}
        ${b.holdOf ? `<div class="caption u-mt-8">원 묶음 <a href="uploads.html?b=${b.holdOf}">${b.holdOf}</a>의 보류 행입니다.</div>` : ''}
        ${b.roundTrip ? `<div class="caption u-mt-8 u-success">왕복 완료 — 반영본 재업로드 ${b.roundTrip.rows}행 모두 동일 (${b.roundTrip.at})</div>` : ''}
      </div>
      <div class="rp-foot">${canResume ? `<a class="btn primary" href="excel-import.html?resume=${b.id}">이어서 작업</a>` : ''}<span class="grow"></span>
        <button class="btn sm" data-toast="원본_${b.file} 내려받기 — 열람 기록이 감사 로그에 남습니다" data-toast-type="info">원본</button>
        ${b.counts ? `<button class="btn sm" data-toast="보정본_${b.id}.xlsx — 화면에서 고친 값 + ‘변경점’ 시트" data-toast-type="info">보정본</button>` : ''}
        ${st === '반영됨' ? `<button class="btn sm primary" data-toast="반영본_${b.id}.xlsx — 반영 시점(${(b.applied || {}).at || '최종 승인'})의 새 버전·ID. 지금 사전과 같은지는 [반영본 다시 올려 확인]에서 비교합니다" data-toast-type="info">반영본</button><a class="btn sm" href="excel-import.html?verify=${b.id}">반영본 다시 올려 확인</a>` : ''}</div>`;
  }
  // hold rows are re-validated against the CURRENT state: rows whose blocker ended move on into a new batch to resume and submit (CX9-20)
  $('pn-up').addEventListener('click', e => {
    if (!e.target.closest('#hold-re')) return;
    if (liveRoleChanged()) { staleRoleToast(); return; }
    const bs = getBatches(), b = bs.find(x => x.id === sel); if (!b || b.holdNext) return;
    const all = getDocs(), dict = getDict();
    const rows = (b.draft || []).filter(r => ['waitDiff', 'pre'].includes(r.st)).map(r => Object.assign({}, r));
    let ready = 0;
    rows.forEach(r => {
      if (r.st === 'waitDiff') { const d = all.find(x => x.id === r.doc); if (!d || !['da', 'final'].includes(d.step)) {
        const cur = dict.find(x => x.id === r.id); const f = Object.keys(r.old || { desc: 1 })[0]; const now = cur ? String(cur[f] == null ? '' : cur[f]) : null;
        if (now === String(r[f])) { r.st = 'same'; r.why = `${r.doc} ${d ? STEP_NAME[d.step] : '종료'} — 지금 사전 값과 같음(신청 불필요)`; }
        else if (d && d.step === 'done' && now !== String((r.old || {})[f])) { r.st = 'conflict'; r.three = { field: '설명', base: (r.old || {})[f], cur: now, file: r[f] }; r.why = `${r.doc} 반영으로 값이 바뀜 — 3방향 비교에서 선택`; ready++; }
        else { r.st = 'chg'; r.why = `${r.doc} ${d ? STEP_NAME[d.step] : '종료'} — 다시 검증: 변경 신청 가능`; ready++; } } }
      else if (r.st === 'pre') { const dc = decompose(r.name); if (dc.ok) { r.st = 'new'; r.why = `단어 ‘${r.word || '구성 단어'}’ 승인됨 — 다시 검증: 등록 신청 가능`; ready++; } else r.why = `아직 승인 전: ${dc.pending.concat(dc.unknown).map(p => p.w).join(', ')}`; }
    });
    if (!rows.length) { toast('이 묶음에는 다시 검증할 보류 행이 없습니다(목업 시드는 행 상세가 없음)', 'info'); return; }
    if (!ready) { toast(`보류 ${rows.length}행 모두 아직 앞선 신청이 진행 중입니다 — 끝나면 다시 검증하세요`, 'info'); return; }
    const id = 'UP-2026-' + String(Math.max(...bs.map(x => +x.id.slice(-4))) + 1).padStart(4, '0');
    const nb = { id, file: `${b.file} (보류 행)`, kind: b.kind, by: ME.id, at: nowStr(), baseline: b.baseline, rows: rows.length, docs: [], status: '임시 저장', holdOf: b.id, draft: rows, counts: null };
    const c = { new: 0, chg: 0, same: 0, waitSame: 0, waitDiff: 0, conflict: 0, dup: 0, pre: 0, err: 0, missing: 0, pick: 0 }; rows.forEach(r => c[r.st]++); nb.counts = c;
    b.holdNext = id; bs.unshift(nb); saveBatches(bs);
    toast(`보류 ${rows.length}행 다시 검증 — 신청 가능 ${ready} · 아직 대기 ${rows.length - ready}. 새 묶음 ${id}에서 이어서 신청하세요`, 'success', { label: '이어서 작업', fn: () => location.href = `excel-import.html?resume=${id}` });
    sel = id; draw();
  });
  $('ub').addEventListener('click', e => { const r = e.target.closest('[data-b]'); if (r) { sel = r.dataset.b; draw(); } });
  document.querySelector('.toolbar').addEventListener('click', e => { const c = e.target.closest('[data-uf]'); if (!c) return; document.querySelectorAll('[data-uf]').forEach(x => x.classList.toggle('on', x === c)); f = c.dataset.uf; sel = null; draw(); });
  draw();
};
</script>
</body>
</html>
