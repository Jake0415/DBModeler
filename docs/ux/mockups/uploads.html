<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>업로드 이력 · NeoDB 목업</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="assets/app.css">
<script src="assets/app.js"></script>
</head>
<body data-page="excel">
<div id="app">
<div id="content" class="page">
  <div class="page-header">
    
    <h1 title="사전 엑셀 일괄(왕복 편집) 묶음 · 30일 임시 보관 · 원본 열람은 올린 사람·DA">업로드 이력</h1>
    
    <div class="actions"><a class="btn primary" href="excel-import.html">사전 엑셀 일괄</a></div>
  </div>
  <div class="toolbar">
    <div class="search" style="flex-basis:260px"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><input class="input" id="uq" placeholder="파일명 · 업로드 번호 · 신청번호 찾기" aria-label="파일명, 업로드 번호, 신청번호 찾기"></div>
    <span role="group" aria-label="상태" class="flex u-gap-8"><button class="chip on" data-uf="">전체</button><button class="chip" data-uf="임시 저장">임시 저장</button><button class="chip" data-uf="신청됨">신청됨</button><button class="chip" data-uf="반영됨">반영됨</button><button class="chip" data-uf="보완">반려·회수</button><button class="chip" data-uf="취소">취소</button></span>
  </div>
  <div class="page-body">
    <div class="main"><div class="listhead" id="ulh"></div><div class="scroll">
      <table class="tbl"><thead><tr><th>업로드</th><th>파일</th><th>종류</th><th>올린 사람</th><th>기준본</th><th class="num">행</th><th>결과</th><th>연결 신청</th><th>상태</th></tr></thead><tbody id="ub"></tbody></table>
    </div></div>
    <aside class="rpanel" id="pn-up" aria-label="업로드 상세"></aside>
  </div>
</div>
</div>
<script>
window.pageInit = function () {
  const $ = id => document.getElementById(id);
  const hx = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);   // 흐름 리뷰2: 파일명(사용자 입력)은 글자로 — 저장형 스크립트 삽입 방지
  const q0 = new URLSearchParams(location.search);
  // list standard L-3: state lives in the address (q · f · sel); the old deep-link key b= keeps working as an alias
  let f = q0.get('f') || '', sel = q0.get('sel') || q0.get('b');
  $('uq').value = q0.get('q') || '';
  document.querySelectorAll('[data-uf]').forEach(x => x.classList.toggle('on', x.dataset.uf === f));
  const docOf = id => getDocs().find(d => d.id === id);   // read live — the batch state is live, a page-load copy of the documents showed '반영됨' next to 'DA 승인'
  const stateOf = batchState;            // one state function shared with the excel screen (CL10-02)
  const vis = canSeeBatch;
  const expired = b => b.token && ['임시 저장', '보완'].includes(stateOf(b)) && (b.token.policy !== getPolicy().ver || b.token.dict !== dictRev());               // same visibility for the list, the ?b= deep link and file actions (CX9-09)
  function draw() {
    const uq = $('uq').value.trim(), ALL = getBatches().filter(vis);
    const L = ALL.filter(b => !f || stateOf(b) === f).filter(b => listMatch(uq, [b.file, b.id, (b.docs || []).join(' ')], 'doc'));
    // a lookup list: the panel opens only for a picked row (L-9) — no first-row auto-select
    const fl = f || uq;
    $('ulh').innerHTML = `<b class="u-fg">${fl ? `${ALL.length}건 중 ${L.length}건` : `${L.length}건`}</b> · 최근 업로드 순${f ? ` <span class="fchips"><button class="fchip" data-uclr="f" aria-label="상태 필터 지우기">상태: ${f === '보완' ? '반려·회수' : hx(f)}<i data-ic=x data-s=12></i></button>` : '<span class="fchips">'}${uq ? `<button class="fchip" data-uclr="q" aria-label="검색어 지우기">검색: ${uq.replace(/[<>&"]/g, '')}<i data-ic=x data-s=12></i></button>` : ''}${fl ? '<button class="btn ghost sm" data-uclr="all">모두 지우기</button>' : ''}</span>`;
    liveCount(`${L.length}건`);
    urlSync(['q', 'f', 'sel', 'b'], { q: uq, f, sel: sel || '' });
    $('ub').innerHTML = L.map(b => { const c = b.counts; const st = stateOf(b); const d = (b.docs || []).map(docOf).filter(Boolean);
      return `<tr class="click ${sel === b.id ? 'sel' : ''}" data-b="${b.id}" tabindex="0"><td class="mono">${b.id}<div class="caption faint">${b.at}</div></td><td>${hx(b.file)}</td><td>${hx(b.kind)}</td><td>${hx(USERS[b.by] ? USERS[b.by].name : b.by)}</td><td class="mono caption">${hx(b.baseline)}</td><td class="num">${b.rows}</td><td class="caption">${c ? `신규 ${c.new} · 변경 ${c.chg} · 후보 ${c.pick || 0} · 동일 ${c.same} · 보류 ${c.waitDiff + c.pre} · 오류 ${c.err}` : b.note || '—'}</td><td>${d.map(x => `<a class="mono" href="approvals.html?doc=${x.id}">${x.id}</a> <span class="caption">${STEP_NAME[x.step]}</span>`).join('<br>') || '—'}</td><td><span class="badge ${st === '반영됨' ? 'b-success' : st === '보완' ? 'b-danger' : st === '취소' ? '' : 'b-info'}">${st === '보완' ? '반려·회수 — 보완 필요' : st}</span>${batchHoldBadge(b)}${expired(b) ? ' <span class="badge b-warning" title="검증 뒤 검수 기준·사전이 바뀜">재검증 필요</span>' : ''}</td></tr>`; }).join('') || (ALL.length && fl   // L-6: emptied by a filter ≠ nothing uploaded yet
      ? '<tr class="er none"><td colspan="9" class="caption muted u-tc u-p-32"><span class="et">필터에 맞는 업로드가 없습니다</span><button class="btn sm ghost" data-uclr="all">모두 지우기</button></td></tr>'
      : '<tr class="er first"><td colspan="9" class="caption muted u-tc u-p-32"><span class="et">아직 업로드가 없습니다</span>사전에서 편집용 엑셀을 내려받아 고친 뒤 올리면 여기에 묶음으로 남습니다.<br><a class="btn sm" href="excel-import.html">사전 엑셀 일괄</a></td></tr>');
    panel();
  }
  function panel() {
    const b = getBatches().find(x => x.id === sel); const p = $('pn-up');
    p.classList.toggle('open', !!sel);
    if (b && !vis(b)) { p.innerHTML = `<div class="rp-head"><h2>${b.id}</h2></div><div class="rp-body"><div class="banner"><i data-ic=info></i><div>다른 사람이 올린 업로드입니다 — 올린 사람과 DA만 볼 수 있습니다.</div></div></div>`; return; }
    if (!b) { p.innerHTML = sel ? `<div class="rp-body"><div class="banner danger"><i data-ic=warn></i><div><b>${hx(sel)}</b> 업로드를 찾을 수 없습니다.</div></div></div>` : ''; return; }
    const st = stateOf(b), c = b.counts || {}, s = b.sub;
    const ds = (b.docs || []).map(docOf).filter(Boolean);
    const canResume = b.by === ME.id && ['임시 저장', '보완'].includes(st);
    p.innerHTML = `<div class="rp-head"><div class="t"><span class="mono">${b.id}</span><span class="badge">${hx(b.kind)}</span><button class="iconbtn close u-w-28 u-h-28" id="up-close" aria-label="상세 닫기 — 묶음은 그대로" title="상세 닫기 — 묶음은 그대로"><i data-ic=x></i></button></div><h2 class="u-mt-8">${hx(b.file)}</h2><div class="rp-sub">${hx(USERS[b.by] ? USERS[b.by].name : '')} · ${hx(b.at)} · 기준본 ${hx(b.baseline)}</div></div>
      <div class="rp-body">
        ${b.counts ? `<div class="section-t u-mt-0">검증·비교 결과</div><dl class="kv" style="grid-template-columns:1fr auto">${[['신규', c.new], ['변경', c.chg], ['동일', c.same], ['동일 내용 대기', c.waitSame], ['다른 내용 대기(보류)', c.waitDiff], ['버전 충돌', c.conflict], ['후보 선택', c.pick], ['선행 승인(보류)', c.pre], ['오류', c.err], ['파일에서 빠짐', c.missing]].map(([l, n]) => `<dt>${l}</dt><dd class="num u-tr">${n || 0}</dd>`).join('')}</dl>` : `<div class="banner warning"><i data-ic=warn></i><div>${b.note || '검증 결과 없음'}</div></div>`}
        ${s ? `<div class="section-t">신청한 내용</div><div class="caption">신규 ${s.new} · 변경 ${s.chg + s.conflict} · 후보 ${s.pick} · 미사용 ${s.unuse} — 보류 ${s.hold} · 제외 ${s.ex}</div>` : ''}
        <div class="section-t">연결 신청</div>${ds.map(d => `<div class="flex u-mb-4"><a class="mono" href="approvals.html?doc=${d.id}">${d.id}</a><span class="badge ${d.step === 'done' ? 'b-success' : ['rejected', 'withdrawn'].includes(d.step) ? 'b-danger' : 'b-info'}">${STEP_NAME[d.step]}</span><span class="caption muted">${d.n}건</span></div>`).join('') || '<div class="caption muted">아직 신청하지 않았습니다</div>'}
        ${expired(b) ? '<div class="banner warning u-mt-8"><i data-ic=warn></i><div>검증 뒤 검수 기준 또는 사전이 바뀌었습니다 — [이어서 작업]에서 다시 검증해야 신청할 수 있습니다. 화면에서 고친 값은 유지됩니다.</div></div>' : ''}
        ${st === '보완' ? '<div class="banner warning u-mt-8"><i data-ic=warn></i><div>반려·회수됐습니다. 이어서 보정한 뒤 다시 신청하면 <b>새 신청번호</b>가 만들어지고 이 묶음에 연결됩니다.</div></div>' : ''}
        ${(c.waitDiff || c.pre) && st !== '임시 저장' && !b.holdNext ? `<div class="banner u-mt-8"><i data-ic=info></i><div class="grow">보류 ${(c.waitDiff || 0) + (c.pre || 0)}행 — 앞선 신청이 끝나면 다시 검증해 <b>새 업로드 묶음</b>으로 이어서 신청합니다.</div>${b.by === ME.id ? '<button class="btn sm" id="hold-re">보류 행 다시 검증</button>' : ''}</div>` : ''}
        ${b.holdNext ? `<div class="caption u-mt-8">보류 행은 <a href="uploads.html?b=${b.holdNext}">${b.holdNext}</a>로 이어졌습니다.</div>` : ''}
        ${b.holdOf ? `<div class="caption u-mt-8">원 묶음 <a href="uploads.html?b=${b.holdOf}">${b.holdOf}</a>의 보류 행입니다.</div>` : ''}
        ${b.roundTrip ? `<div class="caption u-mt-8 u-success">왕복 완료 — 반영본 재업로드 ${b.roundTrip.rows}행 모두 동일 (${b.roundTrip.at})</div>` : ''}
      </div>
      <div class="rp-foot">${canResume ? `<a class="btn primary" href="excel-import.html?resume=${b.id}">이어서 작업</a>` : ''}<span class="grow"></span>
        <span class="caption muted">내려받기 시연(목업)</span>
        <button class="btn sm" aria-label="원본 — 내려받기 시연(목업)" data-toast="원본_${hx(hx(b.file))} — 내려받기 시연(목업): 실제 파일은 내려받지 않습니다. 제품에서는 열람 기록이 감사 로그에 남습니다" data-toast-type="info">원본</button>
        ${b.counts ? `<button class="btn sm" aria-label="보정본 — 내려받기 시연(목업)" data-toast="보정본_${b.id}.xlsx — 내려받기 시연(목업): 화면에서 고친 값 + ‘변경점’ 시트" data-toast-type="info">보정본</button>` : ''}
        ${st === '반영됨' ? `<button class="btn sm${canResume ? '' : ' primary'}" aria-label="반영본 — 내려받기 시연(목업)" data-toast="반영본_${b.id}.xlsx — 내려받기 시연(목업) · 반영 시점(${(b.applied || {}).at || '최종 승인'})의 새 버전·ID. 지금 사전과 같은지는 [반영본 다시 올려 확인]에서 비교합니다" data-toast-type="info">반영본</button><a class="btn sm" href="excel-import.html?verify=${b.id}">반영본 다시 올려 확인</a>` : ''}</div>`;
  }
  // hold rows are re-validated against the CURRENT state: rows whose blocker ended move on into a new batch to resume and submit (CX9-20)
  $('pn-up').addEventListener('click', e => {
    if (!e.target.closest('#hold-re')) return;
    if (liveRoleChanged()) { staleRoleToast(); return; }
    const bs = getBatches(), b = bs.find(x => x.id === sel); if (!b || b.holdNext) return;
    const all = getDocs(), dict = getDict();
    const rows = (b.draft || []).filter(r => ['waitDiff', 'pre'].includes(r.st)).map(r => Object.assign({}, r));
    let ready = 0;
    rows.forEach(r => {
      if (r.st === 'waitDiff') { const d = all.find(x => x.id === r.doc); if (!d || !['da', 'final'].includes(d.step)) {
        const cur = dict.find(x => x.id === r.id); const f = Object.keys(r.old || { desc: 1 })[0]; const now = cur ? String(cur[f] == null ? '' : cur[f]) : null;
        if (now === String(r[f])) { r.st = 'same'; r.why = `${r.doc} ${d ? STEP_NAME[d.step] : '종료'} — 지금 사전 값과 같음(신청 불필요)`; }
        else if (d && d.step === 'done' && now !== String((r.old || {})[f])) { r.st = 'conflict'; r.three = { field: '설명', base: (r.old || {})[f], cur: now, file: r[f] }; r.why = `${r.doc} 반영으로 값이 바뀜 — 3방향 비교에서 선택`; ready++; }
        else { r.st = 'chg'; r.why = `${r.doc} ${d ? STEP_NAME[d.step] : '종료'} — 다시 검증: 변경 신청 가능`; ready++; } } }
      else if (r.st === 'pre') { const dc = decompose(r.name); if (dc.ok) { r.st = 'new'; r.why = `단어 ‘${r.word || '구성 단어'}’ 승인됨 — 다시 검증: 등록 신청 가능`; ready++; } else r.why = `아직 승인 전: ${dc.pending.concat(dc.unknown).map(p => p.w).join(', ')}`; }
    });
    if (!rows.length) { toast('이 묶음에는 다시 검증할 보류 행이 없습니다(목업 시드는 행 상세가 없음)', 'info'); return; }
    if (!ready) { toast(`보류 ${rows.length}행 모두 아직 앞선 신청이 진행 중입니다 — 끝나면 다시 검증하세요`, 'info'); return; }
    const id = 'UP-2026-' + String(Math.max(...bs.map(x => +x.id.slice(-4))) + 1).padStart(4, '0');
    const nb = { id, file: `${b.file} (보류 행)`, kind: b.kind, by: ME.id, at: nowStr(), baseline: b.baseline, rows: rows.length, docs: [], status: '임시 저장', holdOf: b.id, draft: rows, counts: null };
    const c = { new: 0, chg: 0, same: 0, waitSame: 0, waitDiff: 0, conflict: 0, dup: 0, pre: 0, err: 0, missing: 0, pick: 0 }; rows.forEach(r => c[r.st]++); nb.counts = c;
    b.holdNext = id; bs.unshift(nb); saveBatches(bs);
    toast(`보류 ${rows.length}행 다시 검증 — 신청 가능 ${ready} · 아직 대기 ${rows.length - ready}. 새 묶음 ${id}에서 이어서 신청하세요`, 'success', { label: '이어서 작업', fn: () => location.href = `excel-import.html?resume=${id}` });
    sel = id; setF(''); $('uq').value = ''; draw();
  });
  $('pn-up').addEventListener('click', e => { if (!e.target.closest('#up-close')) return; const back = sel; sel = null; draw(); const r = document.querySelector(`#ub tr[data-b="${back}"]`); if (r) r.focus(); });   // L-11: focus returns to the row
  $('ub').addEventListener('click', e => { if (e.target.closest('[data-uclr]')) return; const r = e.target.closest('[data-b]'); if (r && !e.target.closest('a')) { sel = r.dataset.b; draw(); const n = document.querySelector(`#ub tr[data-b="${sel}"]`); if (n) n.focus(); } });
  const setF = v => { f = v; document.querySelectorAll('[data-uf]').forEach(x => x.classList.toggle('on', x.dataset.uf === f)); };
  document.querySelector('.toolbar').addEventListener('click', e => { const c = e.target.closest('[data-uf]'); if (!c) return; setF(c.dataset.uf); sel = null; draw(); });
  $('uq').addEventListener('input', () => { sel = null; draw(); });
  $('uq').addEventListener('keydown', e => { if (e.key === 'Escape' && $('uq').value) { e.stopPropagation(); $('uq').value = ''; draw(); } else if (e.key === 'ArrowDown') { const r = document.querySelector('#ub tr[data-b]'); if (r) { e.preventDefault(); r.focus(); } } });
  document.addEventListener('click', e => { const c = e.target.closest('[data-uclr]'); if (!c) return; const k = c.dataset.uclr; if (k !== 'q') setF(''); if (k !== 'f') $('uq').value = ''; sel = null; draw(); $('uq').focus(); });
  draw();
};
</script>
</body>
</html>
