<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>홈 · DBModeler 목업</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="assets/app.css">
<script src="assets/app.js"></script>
<style>
  /* 8:4 asymmetric — work on the left, the ledger on the right (08 §10) */
  .hl { container:hl / inline-size; display:grid; grid-template-columns:minmax(0, 8fr) minmax(0, 4fr); gap:32px; padding:24px 32px 32px; }
  .hl.lf { grid-template-columns:minmax(0, 4fr) minmax(0, 8fr); }
  .hl > div { min-width:0; }
  .ok-line { font-size:12px; color:var(--fg-3); padding-top:8px; }
  .reasons { margin:8px 0 0; padding-left:20px; font-size:14px; line-height:28px; }
  .reasons li::marker { color:var(--fg-3); font-variant-numeric:tabular-nums; }
  .cols6 { display:grid; grid-template-columns:repeat(6, 1fr); gap:8px; align-items:end; height:96px; margin-top:12px; }
  .cols6 .c { display:flex; flex-direction:column; align-items:stretch; gap:4px; height:100%; justify-content:flex-end; font-size:12px; font-variant-numeric:tabular-nums; color:var(--fg-3); text-align:left; }
  .cols6 .c i { display:block; background:var(--border-strong); min-height:1px; }
  .cols6 .c.pub i { background:var(--accent); }
  .cols6 .c b { font-weight:500; color:var(--fg-2); }
  .page-header .d { font-size:14px; color:var(--fg-3); font-variant-numeric:tabular-nums; }
  /* urgent: one action on the first line (#16) */
  .urgent { margin:24px 32px 0; align-items:center; }
  .urgent > i > .ic, .urgent > .ic { margin-top:0; }
  /* nothing to do: the section folds into one line */
  .sec.calm .sec-h { margin-bottom:0; }
  .sec.calm .sec-h .end { font-size:12px; color:var(--fg-3); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; min-width:0; }
  /* ledger: basis folds under the value below 1700px, so 4 columns never wrap */
  .ledger .lb { display:none; }
  .ledger td.gap { white-space:nowrap; }
  @container hl (max-width:1476px) {
    .ledger th.bc, .ledger td.bc { display:none; }
    .ledger .lb { display:block; font:400 12px/16px var(--font-sans); color:var(--fg-3); white-space:nowrap; }
    .ledger td.v { white-space:nowrap; }
  }
</style>
</head>
<body data-page="home">
<div id="app">
<div id="content" class="page">
  <div class="page-header">
    <h1>홈</h1><span class="d" id="today"></span>
    <div class="actions"><span class="caption muted" id="dictver"></span></div>
  </div>
  <div class="scroll"><div id="home"></div></div>
</div>
</div>
<script>
window.pageInit = function () {
  const $ = id => document.getElementById(id);
  const docs = getDocs(), org = getOrg(), models = getModels();
  const GOAL = org.goal || 90, SLA = org.sla || 3;
  const T0 = MOCK_TODAY;
  $('today').textContent = `${T0.getMonth() + 1}/${T0.getDate()}(${'일월화수목금토'[T0.getDay()]})`;
  $('dictver').textContent = `공통표준 2025.11 · 기관 사전 제정 ${getPub().cha}차`;
  const days = (a, b) => Math.max(0, Math.round(((b || T0) - a) / 864e5));
  const live = docs.filter(d => ['da', 'final'].includes(d.step));
  const lead = ME.has('admin') ? 'admin' : ME.has('da') ? 'da' : ME.has('owner') ? 'owner' : 'modeler';
  const showStats = lead !== 'modeler';

  /* ---- areas: compOf / modelLock / linkState — same numbers as the model screen ---- */
  const AREAS = Object.entries(models).map(([id, m]) => {
    const L = modelLock(id); const mo = L.state !== 'edit' && L.doc && L.doc.model ? L.doc.model : modelOf(id, m.ver);
    const C = compOf(mo); if (L.state === 'edit') { const ended = reqEnded(mo).length; if (ended) { C.bad += ended; C.rate = C.tot ? Math.floor((C.tot - C.bad) / C.tot * 100) : 0; } } const linked = [];
    (mo.E || []).forEach(e => { if (e.st && e.reqDoc) linked.push(e.reqDoc); e.a.forEach(a => { if (a.s === 'req' && a.reqDoc) linked.push(a.reqDoc); }); });
    const open = [...new Set(linked)].filter(x => linkState(x).s === 'live');
    const ents = (mo.E || []).filter(e => !e.ref).length;
    const stage = L.state === 'confirmed' ? '확정' : L.state === 'review' ? '검토' : !ents ? '작업' : C.bad ? '표준 맞추기' : '확정 신청 전';
    return { id, m, L, C, open, ents, stage, sys: m.sys || '요구사항관리', dbms: m.dbms || 'Oracle' };
  });
  const tot = AREAS.reduce((n, a) => n + a.C.tot, 0), okN = AREAS.reduce((n, a) => n + a.C.tot - a.C.bad, 0);
  const RATE = tot ? Math.floor(okN / tot * 100) : 0;
  const myAreas = AREAS.filter(a => ME.systems.includes('전체') || ME.systems.includes(a.sys));
  const areaList = lead === 'modeler' ? myAreas : AREAS;

  /* ---- today's work: one table, others waiting on me first ---- */
  const T = [];
  const q = myQueue(docs);
  const oldest = L => L.length ? Math.max(...L.map(docAge)) : null;
  if (ME.has('da') || ME.has('owner')) { const lt = q.filter(docLate); T.push({ w: 100 + lt.length, t: '결재 대기 · 내 차례', n: q.length, old: oldest(q), st: lt.length ? tag('err', `기한 넘김 ${lt.length}`) : '', go: ['결재함', 'approvals.html?box=queue'] }); }
  if (ME.has('da')) {
    const c = getCands().filter(x => candState(x) === '대기'); T.push({ w: 90, t: '후보 큐 · 판단 대기', n: c.length, old: null, st: '', go: ['후보 큐', 'candidates.html'] });
    const fail = live.filter(d => (d.hist || []).some(h => /재검사 실패/.test(h.act || ''))); if (fail.length) T.push({ w: 95, t: '재검사 실패 · 신청자 보완', n: fail.length, old: oldest(fail), st: tag('err', '실패'), go: [fail[0].id, `approvals.html?doc=${fail[0].id}`] });
  }
  if (ME.has('admin')) {
    const rq = Object.values(USERS).map(u => { try { const r = JSON.parse(dbmStore.get('dbm-rolereq-' + u.id) || 'null'); return r ? Object.assign({ u }, r) : null; } catch (e) { return null; } }).filter(Boolean);
    T.push({ w: 92, t: '역할 요청', n: rq.length, old: null, st: '', go: rq.length ? [rq[0].u.name, `settings.html?user=${rq[0].u.id}`] : ['사용자·역할', 'settings.html'] });
    const al = live.filter(docLate); T.push({ w: 80 + al.length, t: '기한 넘긴 결재 · 기관 전체', n: al.length, old: oldest(al), st: al.length ? tag('err', `${SLA}일 넘김`) : '', go: ['오래 머무는 결재', '#stale'] });
  }
  if (ME.has('modeler')) {
    const bad = myAreas.filter(a => a.L.state === 'edit' && a.C.bad > 0); const nb = bad.reduce((n, a) => n + a.C.bad, 0);
    T.push({ w: 60 + nb, t: '미준수 · 내 업무 영역', n: nb, old: null, st: '', go: bad.length ? ['표준 맞추기', `standardize.html?area=${bad[0].id}`] : ['업무 영역', '#areas'] });
    const blk = [...new Set(myAreas.filter(a => a.L.state === 'edit').flatMap(a => a.open))];
    if (blk.length) T.push({ w: 70, t: '확정 전 완료할 연결 신청', n: blk.length, old: null, st: '', go: [blk[0], `approvals.html?doc=${blk[0]}`] });
  }
  const fix = docs.filter(d => d.req === ME.id && docGroup(d) === 'fix');
  T.push({ w: 85, t: '보완 필요 · 내 신청', n: fix.length, old: null, st: fix.length ? tag('err', '반려·회수') : '', go: fix.length ? [fix[0].id, `approvals.html?doc=${fix[0].id}`] : ['내 신청', 'approvals.html?box=mine'] });
  T.sort((a, b) => b.w - a.w);
  const act = T.filter(t => t.n > 0), calm = T.filter(t => !t.n);
  const calmNames = calm.map(t => t.t.split(' · ')[0]).join(', ');
  /* urgent: at most one action above everything (late approvals on me > fix my request > org-wide late) */
  const myLate = (ME.has('da') || ME.has('owner')) ? q.filter(docLate) : [];
  const orgLate = ME.has('admin') ? live.filter(docLate) : [];
  const U = myLate.length ? { t: `기한 넘긴 결재 <b>${myLate.length}건</b>`, ic: 'clock', a: '결재함 열기', h: 'approvals.html?box=queue' }
    : fix.length ? { t: `보완 필요한 내 신청 <b>${fix.length}건</b>`, ic: 'warn', a: fix.length === 1 ? `${fix[0].id} 열기` : '내 신청 열기', h: fix.length === 1 ? `approvals.html?doc=${fix[0].id}` : 'approvals.html?box=mine' }
    : orgLate.length ? { t: `기관 전체 기한 넘긴 결재 <b>${orgLate.length}건</b>`, ic: 'clock', a: '오래 머무는 결재 보기', h: '#stale' } : null;
  const urgent = U ? `<div class="banner danger urgent" role="status"><i data-ic=${U.ic}></i><span class="grow">${U.t}</span><a class="btn sm" href="${U.h}">${U.a}</a></div>` : '';
  const todo = !act.length ? `<section class="sec calm"><div class="sec-h"><h2>오늘 할 일</h2><span class="end" title="문제 없음: ${calmNames}">처리할 일이 없습니다</span></div></section>`
    : `<section class="sec"><div class="sec-h"><h2>오늘 할 일</h2></div>
    ${act.length ? `<table class="tbl plain box"><thead><tr><th>할 일</th><th class="r">건수</th><th class="r">가장 오래</th><th>상태</th><th class="r">바로 가기</th></tr></thead><tbody>${act.map(t => `<tr><td>${t.t}</td><td class="r num">${t.n}</td><td class="r num">${t.old == null ? '—' : t.old + '일'}</td><td>${t.st || '<span class="faint">—</span>'}</td><td class="r"><a href="${t.go[1]}">${t.go[0]}</a></td></tr>`).join('')}</tbody></table>` : '<div class="ok-line" style="padding:12px 0">처리할 일이 없습니다.</div>'}
    ${calm.length ? `<div class="ok-line">문제 없음: ${calm.map(t => t.t.split(' · ')[0]).join(', ')}</div>` : ''}</section>`;

  /* ---- business areas: a table, not steppers ---- */
  const areas = `<section class="sec" id="areas"><div class="sec-h"><h2>업무 영역</h2><a class="end" href="system.html">시스템 홈</a></div>
    <table class="tbl plain box"><thead><tr><th>영역</th><th>시스템</th><th>단계</th><th class="r">준수율</th><th class="r">미준수</th><th>다음 행동</th></tr></thead><tbody>${areaList.map(a => {
      const below = a.C.rate < GOAL;
      const next = a.L.state === 'review' ? `<a href="approvals.html?doc=${a.L.doc.id}">${a.L.doc.id}</a> ${docLate(a.L.doc) ? tag('err', docAge(a.L.doc) + '일') : `<span class="muted">${STEP_NAME[a.L.doc.step]} ${docAge(a.L.doc)}일</span>`}`
        : a.L.state === 'confirmed' ? `<a href="model.html?area=${a.id}">다음 버전 시작</a>`
        : !a.ents ? `<a href="model.html?area=${a.id}">모델 시작</a>`
        : a.C.bad ? `<a href="standardize.html?area=${a.id}">표준 맞추기</a>`
        : a.open.length ? `<span class="muted">${a.open.join(', ')} 완료 후 확정</span>` : `<a href="model.html?area=${a.id}">확정 신청</a>`;
      return `<tr><td><a href="model.html?area=${a.id}">${a.m.name}</a></td><td class="muted">${a.sys} <span class="faint">${a.dbms}</span></td><td>${a.L.state === 'review' ? tag('run', '검토') : a.L.state === 'confirmed' ? tag('ok', '확정') : `<span class="muted">${a.stage}</span>`}</td><td class="r"><span class="num">${a.C.rate}%</span><span class="mbar${below ? ' bad' : ''}"><i style="width:${a.C.rate}%"></i><b style="left:${GOAL}%"></b></span></td><td class="r num">${a.C.bad || '—'}</td><td>${next}</td></tr>`; }).join('') || '<tr class="er first"><td colspan="6" class="muted">담당 업무 영역이 없습니다.</td></tr>'}</tbody></table>
    <div class="ok-line">막대의 세로 눈금은 목표 준수율 ${GOAL}%입니다.</div></section>`;

  /* ---- ledger (right): value · basis · gap ---- */
  const lt = live.filter(docLate);
  const done = docs.filter(d => d.step === 'done' && (d.hist || []).length);
  const leadT = done.length ? done.reduce((n, d) => n + days(toDay(d.date), toDay(d.hist[d.hist.length - 1].at)), 0) / done.length : 0;
  const st = { conf: AREAS.filter(a => a.L.state === 'confirmed').length, rev: AREAS.filter(a => a.L.state === 'review').length };
  const dict = getDict().filter(x => x.ver > 0 || x.st === '사용');
  const month = dict.filter(x => (x.dt || '').startsWith('2026-11')).length;
  const candN = getCands().filter(x => candState(x) === '대기').length;
  const judge = (bad, txt) => `<td class="gap ${bad ? 'bad' : 'ok'}">${txt}</td>`;
  const ledger = `<section class="sec"><div class="sec-h"><h2>현황</h2></div>
    <table class="tbl plain box ledger"><thead><tr><th>항목</th><th class="r">값</th><th class="bc">기준</th><th class="r">판정</th></tr></thead><tbody>
      <tr><td><a href="#areas">표준 준수율</a></td><td class="v">${RATE}%<span class="lb">목표 ${GOAL}%</span></td><td class="muted bc">목표 ${GOAL}%</td>${judge(RATE < GOAL, RATE < GOAL ? (GOAL - RATE) + '%p 부족' : '충족')}</tr>
      <tr><td><a href="#stale">기한 넘긴 결재</a></td><td class="v">${lt.length}<span class="lb">기준 0건</span></td><td class="muted bc">0건</td>${judge(lt.length > 0, lt.length ? lt.length + '건 넘김' : '충족')}</tr>
      <tr><td>평균 처리 기간</td><td class="v">${leadT.toFixed(1)}일<span class="lb">${SLA}일 이내</span></td><td class="muted bc">${SLA}일 이내</td>${judge(leadT > SLA, leadT > SLA ? (leadT - SLA).toFixed(1) + '일 초과' : '충족')}</tr>
      <tr><td><a href="approvals.html${ME.has('da') || ME.has('owner') ? '?box=all' : '?box=mine'}">진행 중 결재</a></td><td class="v">${live.length}</td><td class="muted bc">—</td><td class="gap ok">—</td></tr>
      <tr><td><a href="#areas">확정된 업무 영역</a></td><td class="v">${st.conf}/${AREAS.length}</td><td class="muted bc">—</td><td class="gap ok">검토 중 ${st.rev}</td></tr>
      <tr><td><a href="dictionary.html">표준 사전 항목</a></td><td class="v">${dict.length}</td><td class="muted bc">—</td><td class="gap ok">이번 달 ${month}건 변경</td></tr>
      <tr><td><a href="candidates.html">후보 큐 대기</a></td><td class="v">${candN}</td><td class="muted bc">—</td><td class="gap ok">—</td></tr>
    </tbody></table></section>`;

  /* ---- my requests (right): short table, fix first ---- */
  const mineAll = docs.filter(d => d.req === ME.id);
  const mineOpen = mineAll.filter(d => docGroup(d) !== 'done').sort((a, b) => (docGroup(a) === 'fix' ? -1 : 0) - (docGroup(b) === 'fix' ? -1 : 0));
  const mineDone = mineAll.filter(d => docGroup(d) === 'done');
  const mine = `<section class="sec" id="mine"><div class="sec-h"><h2>내 신청</h2><a class="end" href="approvals.html?box=mine">전체</a></div>
    ${mineOpen.length ? `<table class="tbl plain box"><thead><tr><th>신청번호</th><th>단계</th><th class="r">머문 일</th></tr></thead><tbody>${mineOpen.map(d => `<tr><td><a class="mono" href="approvals.html?doc=${d.id}" title="${d.title}">${d.id}</a></td><td>${docTag(d)}</td><td class="r num">${docGroup(d) === 'live' ? docAge(d) + '일' : '—'}</td></tr>`).join('')}</tbody></table>` : '<div class="ok-line" style="padding:12px 0">진행 중인 신청이 없습니다.</div>'}
    ${mineDone.length ? `<div class="ok-line">완료 ${mineDone.length}건: ${mineDone.slice(0, 3).map(d => `<a class="mono" href="approvals.html?doc=${d.id}">${d.id.slice(-4)}</a>`).join(', ')}</div>` : ''}</section>`;

  /* ---- my candidates (modeler) ---- */
  const myC = getCands().filter(c => c.loc.some(l => l.by === ME.id));
  const cand = ME.has('modeler') && myC.length ? `<section class="sec"><div class="sec-h"><h2>내 후보</h2><a class="end" href="candidates.html">후보 큐</a></div><table class="tbl plain box"><tbody>${myC.map(c => { const s = candState(c); return `<tr><td><a href="candidates.html?c=${c.id}">${c.name}</a> <span class="muted">${c.t}</span></td><td class="r">${s === '등록 완료' ? tag('ok', s) : s === '대기' ? `<span class="muted">판단 대기</span>` : tag('run', s)}</td></tr>`; }).join('')}</tbody></table></section>` : '';

  /* ---- statistics (DA · owner · Admin) ---- */
  let stats = '', staleS = '', weeksS = '';
  if (showStats) {
    const F = [['DA 승인 대기', 'da'], ['최종 승인 대기', 'final']].map(([l, s]) => { const x = docs.filter(d => d.step === s); return { l, n: x.length, a: x.length ? x.reduce((n, d) => n + docAge(d), 0) / x.length : 0 }; });
    F.push({ l: '완료', n: docs.filter(d => d.step === 'done').length, a: null }, { l: '반려·회수', n: docs.filter(d => docGroup(d) === 'fix').length, a: null });
    const fmax = Math.max(...F.map(f => f.n), 1); const worst0 = F.slice(0, 2).filter(f => f.n).sort((a, b) => b.a - a.a)[0]; const worst = worst0 && worst0.a >= SLA ? worst0 : null;
    const R = new Map(); const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]); const add = (t, id) => { const k = esc(t).replace(/'[^']*'/g, '‘…’').replace(/\([^)]*\)/g, '').replace(/[A-Z]{1,3}-\d{4}(-\d{4})?/g, '…').replace(/\d+자/g, 'N자').trim(); if (!R.has(k)) R.set(k, new Set()); R.get(k).add(id); };
    docs.forEach(d => (d.hist || []).forEach(h => { if (/반려|재검사 실패/.test(h.act || '') && h.why) add(h.why, d.id); }));
    live.filter(d => d.type === 'dict').forEach(d => { try { checkDictDoc(d).forEach(r => r.problems.forEach(p => add(p, d.id))); } catch (e) {} });
    const top = [...R.entries()].map(([k, s]) => [k, s.size, [...s]]).sort((a, b) => b[1] - a[1]).slice(0, 5);
    stats = `<section class="sec"><div class="sec-h"><h2>결재 흐름</h2>${worst ? `<span class="end">${tag('err', `병목 ${worst.l.replace(' 대기', '')} ${worst.a.toFixed(1)}일`)}</span>` : ''}</div>
      <div style="max-width:640px;margin-top:8px">${F.map(f => `<div class="hbar"><span>${f.l}</span><span class="t"><i class="${f === worst ? 'hi' : ''}" style="width:${f.n / fmax * 100}%"></i></span><span class="v">${f.n}${f.a != null && f.n ? ' · ' + f.a.toFixed(1) + '일' : ''}</span></div>`).join('')}</div></section>
      <section class="sec"><div class="sec-h"><h2>막힘 사유</h2><a class="end" href="settings.html#rules">검수 기준</a></div>
      ${top.length ? `<ol class="reasons">${top.map(([k, n, ids]) => `<li>${k} <span class="num muted">${n}건</span> ${ids.slice(0, 2).map(id => `<a class="mono" href="approvals.html?doc=${id}">${id.slice(-4)}</a>`).join(' ')}</li>`).join('')}</ol>` : '<div class="ok-line">막힌 신청이 없습니다.</div>'}</section>`;
    const stale = live.slice().sort((a, b) => docAge(b) - docAge(a)).slice(0, 5);
    staleS = `<section class="sec" id="stale"><div class="sec-h"><h2>오래 머무는 결재</h2><a class="end" href="approvals.html">결재함</a></div>
      <table class="tbl plain box"><tbody>${stale.map(d => `<tr><td><a class="mono" href="approvals.html?doc=${d.id}" title="${d.title}">${d.id}</a></td><td class="muted">${STEP_NAME[d.step]}</td><td class="r">${docLate(d) ? tag('err', docAge(d) + '일') : `<span class="num muted">${docAge(d)}일</span>`}</td></tr>`).join('') || '<tr><td class="muted">진행 중인 결재가 없습니다.</td></tr>'}</tbody></table></section>`;
    const weeks = []; for (let i = 5; i >= 0; i--) { const end = new Date(T0 - i * 7 * 864e5), start = new Date(end - 6 * 864e5); weeks.push({ start, end, n: 0 }); }
    getDict().forEach(x => { const d = toDay(x.dt); if (!d) return; const w = weeks.find(w => d >= w.start && d <= w.end); if (w) w.n++; });
    const pubD = toDay(getPub().at); const wmax = Math.max(...weeks.map(w => w.n), 1);
    weeksS = `<section class="sec"><div class="sec-h"><h2>사전 변경 · 최근 6주</h2><a class="end" href="dict-history.html">변경 내역</a></div>
      <div class="cols6">${weeks.map(w => { const pub = pubD && pubD >= w.start && pubD <= w.end; return `<div class="c${pub ? ' pub' : ''}"><b>${w.n || ''}</b><i style="height:${w.n / wmax * 64}px"></i><span>${w.end.getMonth() + 1}/${w.end.getDate()}${pub ? ' 공표' : ''}</span></div>`; }).join('')}</div></section>`;
  }

  /* ---- layout by role: same frame, order differs ---- */
  const left = lead === 'modeler' ? todo + areas : todo + areas + stats;
  const right = lead === 'modeler' ? mine + cand : (lead === 'admin' || lead === 'owner' ? ledger + staleS + weeksS + (ME.has('modeler') ? mine : '') : ledger + mine + staleS + weeksS + cand);
  const lf = lead === 'admin' || lead === 'owner';
  $('home').innerHTML = urgent + (lf ? `<div class="hl lf"><div>${right}</div><div>${left}</div></div>` : `<div class="hl"><div>${left}</div><div>${right}</div></div>`);
};
</script>
</body>
</html>
