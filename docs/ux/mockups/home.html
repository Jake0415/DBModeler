<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>홈 · DBModeler 목업</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="assets/app.css">
<script src="assets/app.js"></script>
<style>
  .hgrid { display:grid; grid-template-columns:2fr 1fr; gap:16px; }
  .hcard { border:1px solid var(--border); border-radius:8px; background:var(--surface); }
  .hcard .hh { display:flex; align-items:center; gap:8px; padding:12px 16px; border-bottom:1px solid var(--border); }
  .hcard .hh h2 { font-size:14px; margin:0; }
  .hcard .hb { padding:8px 16px 12px; }
  .row { display:flex; align-items:center; gap:8px; padding:8px 0; border-bottom:1px solid var(--border); font-size:13px; color:var(--fg); text-decoration:none; }
  .row:last-child { border-bottom:0; }
  .row:hover { color:var(--fg); background:var(--surface-2); }
</style>
</head>
<body data-page="home">
<div id="app">
<div id="content" class="page">
  <div class="page-header">
    <h1 id="hello">안녕하세요</h1>
    <span class="role-tag" id="roles"></span>
    <div class="actions"><span class="caption muted" id="dictver"></span></div>
  </div>
  <div class="scroll"><div class="pad">
    <div class="hgrid">
      <div style="display:flex;flex-direction:column;gap:16px">
        <section class="hcard"><div class="hh"><h2>내 차례 결재</h2><span class="badge" id="q-n">0</span><span class="grow"></span><a class="caption" href="approvals.html">결재함 →</a></div><div class="hb" id="q-list"></div></section>
        <section class="hcard"><div class="hh"><h2>내 신청</h2><span class="grow"></span><a class="caption" href="approvals.html?box=mine">전체 →</a></div><div class="hb" id="m-list"></div></section>
        <section class="hcard"><div class="hh"><h2>최근 업무 영역</h2></div><div class="hb" id="areas"></div></section>
      </div>
      <div style="display:flex;flex-direction:column;gap:16px">
        <section class="hcard"><div class="hh"><h2>내 후보 처리 결과</h2></div><div class="hb">
          <a class="row" href="candidates.html"><span class="badge b-violet">단어</span>수령자<span class="grow"></span><span class="caption">신청 전환 · REQ-0012</span></a>
          <a class="row" href="candidates.html"><span class="badge b-violet">단어</span>검수<span class="grow"></span><span class="caption muted">DA 처리 대기</span></a>
        </div></section>
        <section class="hcard"><div class="hh"><h2>새 기능</h2><span class="badge b-info" id="vtag"></span></div><div class="hb caption" style="line-height:22px">
          산출물 화면 · 표 보기(일괄편집·찾기/바꾸기) · 모델 검토 · 제약·인덱스 · 서브타입·배타 관계<br><button class="btn sm" style="margin-top:8px" onclick="openAbout()">릴리스 노트</button>
        </div></section>
        <section class="hcard"><div class="hh"><h2>공지</h2></div><div class="hb caption" style="line-height:22px">11/20(목) 18:00~19:00 정기 점검 — 편집 내용은 자동 보관됩니다.<br>공통표준 2025.11 반영 완료(11/03).</div></section>
      </div>
    </div>
  </div></div>
</div>
</div>
<script>
window.pageInit = function () {
  const docs = getDocs();
  document.getElementById('hello').textContent = `${ME.name}님, 안녕하세요`;
  document.getElementById('roles').innerHTML = roleBadges(ME);
  document.getElementById('dictver').textContent = '사전 기준 · ' + PRODUCT.dict;
  document.getElementById('vtag').textContent = PRODUCT.version;
  const q = myQueue(docs);
  document.getElementById('q-n').textContent = q.length;
  const row = d => `<a class="row" href="approvals.html?doc=${d.id}"><span class="mono">${d.id}</span><span class="badge ${d.type === 'model' ? 'b-violet' : ''}">${d.type === 'model' ? '모델 확정' : '사전 신청'}</span>${d.title}<span class="grow"></span><span class="caption muted">${USERS[d.req].name}${d.req === ME.id ? ' (나)' : ''}</span><span class="badge b-info">● ${STEP_NAME[d.step]}</span></a>`;
  document.getElementById('q-list').innerHTML = q.length ? q.map(row).join('') : `<div class="caption muted" style="padding:16px 0">${ME.has('da') || ME.has('owner') ? '지금 처리할 결재가 없습니다.' : '결재 권한이 없는 역할입니다 — 내 신청에서 진행 상황을 보세요.'}</div>`;
  // area badges from the same lock judgement as the model screen
  document.getElementById('areas').innerHTML = ['rq', 'risk'].map(a => { const L = modelLock(a); const b = L.state === 'review' ? `<span class="badge b-info">● v${L.model.ver} 검토 중 · ${L.doc.id}</span>` : L.state === 'confirmed' ? `<span class="badge b-success">v${L.model.ver} 확정본</span>` : `<span class="badge mono">v${L.model.ver} 작업 중</span>`; return `<a class="row" href="model.html?area=${a}"><b>${L.model.name}</b><span class="caption muted">요구사항관리 · Oracle</span><span class="grow"></span>${b}</a>`; }).join('');
  const mine = docs.filter(d => d.req === ME.id);
  document.getElementById('m-list').innerHTML = mine.length ? mine.map(row).join('') : '<div class="caption muted" style="padding:16px 0">신청한 문서가 없습니다.</div>';
};
</script>
</body>
</html>
